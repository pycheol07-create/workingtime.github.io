<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="js/theme-boot.js?v=202610271255"></script>
    <link rel="stylesheet" href="css/suit.css?v=202610271255">
    <link rel="stylesheet" href="css/app-shell.css?v=202610271255">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="비품관리">
    <title>비품 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="css/tool-d.css?v=202610271255">
    <style>
        body { font-family: 'SUIT', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
        /* 칸마다 최소 폭(th의 min-width)을 두므로 표는 내용 폭을 따르되, 좁을 땐 영역을 꽉 채운다. */
        .sup-table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 13px; }
        .sup-table th { background: var(--c-surface-2); color: var(--c-text-2); font-weight: 700; padding: 4px 8px; border-bottom: 1px solid var(--c-line); white-space: nowrap; text-align: center; position: sticky; top: 0; z-index: 1; }
        /* 헤더 정렬·필터 */
        .th-wrap { display: flex; align-items: center; justify-content: center; gap: 2px; }
        .th-sort { display: inline-flex; align-items: center; gap: 3px; font: inherit; color: inherit; background: none; border: 0; padding: 4px 3px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .th-sort:hover { background: var(--c-track); }
        .th-ic { font-size: 10px; color: var(--c-text-4); }
        .th-sort.active { color: var(--c-accent-deep); }
        .th-sort.active .th-ic { color: var(--c-accent); }
        .th-filter { border: 0; background: none; color: var(--c-text-3); font-size: 11px; cursor: pointer; padding: 4px 3px; border-radius: 4px; line-height: 1; min-width: 24px; min-height: 24px; display: inline-flex; align-items: center; justify-content: center; }
        .th-filter:hover { background: var(--c-track); color: var(--c-text-2); }
        .th-filter.on { color: var(--c-accent); background: var(--c-accent-soft); }
        .flt-pop { position: fixed; z-index: 60; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-inner); box-shadow: var(--sh-pop); padding: 10px; width: 224px; font-size: 12px; color: var(--c-text); }
        .flt-list { max-height: 220px; overflow: auto; margin-top: 6px; border-top: 1px solid var(--c-line-soft); padding-top: 6px; }
        .flt-row { display: flex; align-items: center; gap: 6px; padding: 3px 2px; cursor: pointer; border-radius: 4px; }
        .flt-row:hover { background: var(--c-track); }
        .flt-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .flt-cnt { margin-left: auto; color: var(--c-text-3); font-size: 11px; }
        .flt-btn { font-size: 11px; font-weight: 700; color: var(--c-accent-deep); background: none; border: 0; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .flt-btn:hover { background: var(--c-accent-soft); }
        .sup-table td { padding: 9px 12px; border-bottom: 1px solid var(--c-line-soft); color: var(--c-text); vertical-align: middle; white-space: nowrap; }
        .sup-table td.wrap { white-space: normal; }
        /* 부족·발주 필요 행 — hover 규칙과 명시도가 같아 반드시 그 앞에 둔다(마우스를 올리면 hover 색이 이긴다) */
        .sup-table tbody tr.row-warn td { background: var(--c-risk-row); }
        .sup-table tbody tr.row-warn td:first-child { box-shadow: inset 3px 0 0 var(--c-risk); }
        .sup-table tbody tr:hover td { background: var(--c-accent-row); }
        /* 행을 누르거나 Tab 으로 가서 Enter/Space 를 누르면 상세 창이 열린다 */
        .sup-table tbody tr[data-open] { cursor: pointer; }
        .sup-table tbody tr[data-open]:focus { outline: none; }
        /* 포커스 표시 — 표 행은 outline 이 브라우저마다 달라 칸마다 안쪽 그림자로 2px 테두리를 그린다 */
        .sup-table tbody tr[data-open]:focus-visible td { background: var(--c-accent-row); box-shadow: inset 0 2px 0 var(--c-accent), inset 0 -2px 0 var(--c-accent); }
        .sup-table tbody tr[data-open]:focus-visible td:first-child { box-shadow: inset 2px 0 0 var(--c-accent), inset 0 2px 0 var(--c-accent), inset 0 -2px 0 var(--c-accent); }
        .sup-table tbody tr[data-open]:focus-visible td:last-child { box-shadow: inset -2px 0 0 var(--c-accent), inset 0 2px 0 var(--c-accent), inset 0 -2px 0 var(--c-accent); }
        .sup-card[data-open]:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }
        /* 요약 카드 중 필터 버튼(재고 부족·발주 필요) — #tool-root 접두: tool-d.css 의 .border-slate-200 재칠을 이긴다 */
        #tool-root .sum-btn { cursor: pointer; }
        #tool-root .sum-btn:hover { border-color: var(--c-line-strong); }
        #tool-root .sum-btn[aria-pressed="true"] { border-color: var(--c-risk); box-shadow: inset 0 0 0 1px var(--c-risk); }
        .sum-btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .sup-table td.mid { text-align: center; font-variant-numeric: tabular-nums; }
        .lbl { display:block; font-size: 11px; font-weight: 700; color: var(--c-text-2); margin-bottom: 4px; }
        .inp { width: 100%; padding: 8px 10px; border: 1px solid var(--c-line-strong); border-radius: var(--r-sm); font-size: 13px; }
        .inp:focus { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }
        /* 머리줄은 공통 상단바(css/app-shell.css --as-h) 아래에 붙는다 */
        #tool-root > header.sticky { top: var(--as-h, 0px); }
        @media (min-width: 1024px) { #tool-root main .overflow-auto.lg\:max-h-\[calc\(100vh-252px\)\] { max-height: calc(100vh - 252px - var(--as-h, 0px)); } }
    </style>
</head>
<body id="tool-root" data-shell="supplies" class="bg-slate-100 text-slate-800">

    <header class="bg-white border-b border-slate-200 px-5 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20 shadow-sm">
        <h1 class="text-lg font-extrabold text-slate-800 flex items-center gap-2">비품 관리</h1>
        <div class="flex items-center gap-2">
            <button id="btn-add-item" class="text-xs font-bold px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition">비품 추가</button>
            <button id="btn-refresh" class="text-xs font-bold px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white transition">새로고침</button>
            <button id="btn-close" class="text-xs font-bold px-3 py-2 rounded-lg bg-slate-100 hover:bg-red-100 hover:text-red-600 text-slate-700 transition" title="홈(대시보드)으로">홈으로</button>
        </div>
    </header>

    <div id="auth-gate" class="hidden max-w-md mx-auto mt-24 text-center p-8 bg-white rounded-2xl shadow">
        <div class="mb-3 text-slate-300"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="inline-block" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
        <div class="font-bold text-slate-800 mb-1">로그인이 필요합니다</div>
        <div class="text-sm text-slate-500">메인 앱(업무관리)에서 먼저 로그인한 뒤<br>이 페이지를 열어주세요.</div>
    </div>

    <!-- 왼쪽 = 주요 비품 / 오른쪽 = 요약 + 전체 목록(남는 폭 전부) -->
    <main id="main" class="hidden px-4 py-5 flex flex-col lg:flex-row gap-5 items-start">

        <!-- 주요 비품 (택배봉투 / 포장봉투 등) -->
        <section class="w-full lg:w-[196px] lg:shrink-0">
            <h2 class="text-sm font-bold text-slate-600 mb-2 flex items-center gap-2">주요 비품</h2>
            <div id="main-items" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3"></div>
        </section>

        <!-- min-w-0 이 없으면 표의 가로 스크롤 영역이 줄어들지 못해 화면 밖으로 삐져나간다. -->
        <div class="flex-1 min-w-0 w-full space-y-5">

        <!-- 이지어드민 자동 반영(매일 19:30 앱\비품재고연동\연동.py) 결과 한 줄 — 문서에 ezSyncedAt 이 있을 때만 js/supplies.js 가 켠다 -->
        <div id="ez-sync-note" class="hidden text-xs text-slate-600 bg-white border border-slate-200 rounded-xl px-4 py-2"></div>

        <!-- 요약 -->
        <section id="summary" class="grid grid-cols-2 md:grid-cols-5 gap-3"></section>

        <!-- 전체 목록 -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-sm font-bold text-slate-700">전체 비품 목록</h2>
                <div class="flex flex-wrap items-center gap-2">
                    <select id="filter-category" class="text-xs border border-slate-300 rounded-lg px-2 py-1.5 bg-white"></select>
                    <input id="filter-search" type="search" placeholder="품명·업체 검색" class="text-xs border border-slate-300 rounded-lg px-2 py-1.5 w-44">
                    <label class="flex items-center gap-1.5 text-xs text-slate-600 font-bold">
                        <input type="checkbox" id="filter-low"> 부족분만
                    </label>
                    <label class="flex items-center gap-1.5 text-xs text-slate-600 font-bold" title="사용량 예측(매일 08:30)에서 '발주 필요'인 비품만">
                        <input type="checkbox" id="filter-order"> 발주 필요만
                    </label>
                    <button id="btn-reset-filters" class="hidden text-xs font-bold px-2 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-red-100 hover:text-red-600 transition">필터 초기화</button>
                </div>
            </div>
            <!-- 화면 높이에서 헤더·요약·도구모음을 뺀 나머지를 목록이 전부 쓴다 — 데스크톱(lg, 1024px~)만. 휴대폰은 높이 제한을 풀어 페이지 스크롤 하나로(이중 스크롤 방지) -->
            <div class="overflow-auto lg:max-h-[calc(100vh-252px)]">
                <table class="sup-table">
                    <thead>
                        <!-- 헤더는 js/supplies.js 의 COLS 로부터 생성된다(정렬·필터 버튼 포함) -->
                        <tr id="items-head"></tr>
                    </thead>
                    <tbody id="items-body"></tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden p-10 text-center text-slate-400 text-sm">
                등록된 비품이 없습니다. <b>비품 추가</b>로 등록하세요.
            </div>
        </section>

        </div>
    </main>

    <!-- 현재고조회 엑셀 업로드용(상세 창 재고 패널의 [엑셀로 재고 맞추기]가 이 입력을 대신 누른다) -->
    <input type="file" id="stock-file" class="hidden" accept=".xls,.xlsx,.htm,.html,.csv">

    <!-- 비품 상세 창 — 목록 행·주요 비품 카드를 누르면 열린다.
         왼쪽 = 상세(수정) 폼, 오른쪽 = 재고 패널(md 이상 나란히, 휴대폰은 아래로 쌓임).
         새 비품 추가일 때는 재고 패널을 숨기고 폭도 max-w-2xl 로 줄인다(js/supplies.js openItemModal). -->
    <div id="item-modal" class="hidden fixed inset-0 bg-black/50 items-start justify-center z-50 p-4 overflow-y-auto">
        <!-- my-auto: 화면에 들어가면 가운데, 창이 더 높으면 위에서부터(제목·× 가 잘리지 않음) -->
        <div id="item-modal-box" class="bg-white rounded-2xl shadow-xl w-full max-w-2xl my-auto overflow-hidden">
            <!-- 머리줄을 끌면 창이 움직인다(PC 마우스만 — 공통 js/modal-drag.js) -->
            <div id="item-modal-head" class="px-6 py-4 border-b border-slate-200 flex justify-between items-center md:cursor-move md:select-none" title="끌어서 창 위치를 옮길 수 있습니다">
                <h2 id="item-modal-title" class="text-base font-bold">비품 추가</h2>
                <button type="button" data-close aria-label="닫기" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
            </div>
            <!-- 배치: 휴대폰 = 재고 → 상세 → 이력 세로(재고 패널 order-first) / md~xl = 상세 | (재고 위 · 이력 아래) / xl 이상 = 상세 | 재고 | 이력 세 칸.
                 새 비품 추가(재고 칸 숨김)면 상세가 md:col-span-full 로 전체 폭을 쓴다(js/supplies.js openItemModal). -->
            <div id="item-modal-grid" class="flex flex-col md:grid md:grid-cols-[minmax(0,1fr)_320px] md:grid-rows-[auto_1fr] xl:grid-cols-[minmax(0,1fr)_340px_300px] xl:grid-rows-1">
            <div id="item-detail-cell" class="min-w-0 flex flex-col md:row-span-2 xl:row-span-1">
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="md:col-span-2">
                        <label class="lbl">품명 *</label>
                        <input id="f-name" class="inp" placeholder="예: 택배봉투">
                    </div>
                    <div>
                        <label class="lbl">종류</label>
                        <input id="f-category" class="inp" list="category-list" placeholder="예: 포장자재">
                        <datalist id="category-list"></datalist>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                        <label class="lbl">현재고 *</label>
                        <input id="f-stock" type="number" min="0" class="inp num" placeholder="0">
                    </div>
                    <div>
                        <label class="lbl">단위</label>
                        <input id="f-unit" class="inp" placeholder="개 / 박스 / 롤">
                    </div>
                    <div>
                        <label class="lbl">안전재고</label>
                        <input id="f-safety" type="number" min="0" class="inp num" placeholder="0">
                    </div>
                    <div>
                        <label class="lbl">단가 (원)</label>
                        <input id="f-price" type="number" min="0" class="inp num" placeholder="0">
                        <details id="price-history" class="hidden mt-1">
                            <summary class="text-[11px] text-slate-500 cursor-pointer select-none">단가 변경 이력</summary>
                            <ul id="price-history-list" class="mt-1 space-y-0.5 text-[11px] text-slate-500"></ul>
                        </details>
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-4">
                    <div class="text-xs font-bold text-slate-500 mb-3">상세 정보</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="lbl">사이즈 / 규격</label>
                            <input id="f-size" class="inp" placeholder="예: 25 x 35cm, 두께 0.06mm">
                        </div>
                        <div>
                            <label class="lbl">이지어드민 품목코드</label>
                            <input id="f-ez-code" class="inp" placeholder="예: A0012 (여러 개면 쉼표로 구분)">
                            <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">
                                이지어드민 사용내역을 자동 반영할 때 이 코드로 비품을 찾습니다.
                                비워 두면 품명이 정확히 같은 경우에만 매칭됩니다.
                            </p>
                        </div>
                        <div>
                            <label class="lbl">업체명</label>
                            <input id="f-vendor" class="inp" placeholder="예: ○○포장">
                        </div>
                        <div>
                            <label class="lbl">업체 연락처 / 담당자</label>
                            <input id="f-vendor-contact" class="inp" placeholder="예: 김대리 010-0000-0000">
                        </div>
                        <div>
                            <label class="lbl">MOQ (최소주문수량)</label>
                            <input id="f-order-unit" class="inp" placeholder="예: 1박스 = 500장 / 최소 10박스">
                        </div>
                        <div>
                            <label class="lbl">리드타임 (입고 소요기간)</label>
                            <div class="flex gap-1">
                                <input id="f-leadtime" type="number" min="0" class="inp num" placeholder="예: 3">
                                <select id="f-leadtime-unit" class="inp" style="width:84px;flex:0 0 auto">
                                    <option value="day">일</option>
                                    <option value="week">주</option>
                                    <option value="month">개월</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="lbl">최근 발주일</label>
                            <input id="f-last-order" type="date" class="inp">
                        </div>
                        <div class="md:col-span-2">
                            <label class="lbl">발주 메모 / 기타</label>
                            <input id="f-memo" class="inp" placeholder="예: 매주 화요일 발주, 우천 시 배송 지연">
                        </div>
                    </div>
                </div>

                <label class="flex items-center gap-2 text-sm font-bold text-slate-600">
                    <input type="checkbox" id="f-main"> 주요 비품으로 상단에 고정
                </label>

                <p id="item-modal-error" class="hidden text-xs text-red-600 font-bold"></p>
            </div>
            <div class="mt-auto px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                <button type="button" id="btn-delete-item" class="hidden px-3 py-2 text-xs rounded-lg bg-red-50 hover:bg-red-100 text-red-600 font-bold">삭제</button>
                <div class="flex gap-2 ml-auto">
                    <button type="button" data-close class="px-4 py-2 text-sm rounded-lg bg-white border border-slate-300 hover:bg-slate-100">취소</button>
                    <button type="button" id="btn-save-item" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold">저장</button>
                </div>
            </div>
            </div>

            <!-- 재고 패널 — [재고 반영]은 재고만 저장하고 창을 닫지 않는다. -->
            <aside id="stock-panel" class="hidden order-first md:order-none md:col-start-2 md:row-start-1 min-w-0 border-t md:border-t-0 md:border-l border-slate-200 bg-slate-50">
                <div class="p-5 flex flex-col gap-3">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <div class="text-[11px] font-bold text-slate-400">현재고</div>
                            <div class="flex items-end gap-1 mt-0.5">
                                <span id="stock-current" class="text-3xl font-black leading-none text-slate-800">0</span>
                                <span id="stock-unit" class="text-sm font-bold text-slate-400">개</span>
                            </div>
                        </div>
                        <span id="stock-low-badge" class="hidden text-[11px] font-bold px-1.5 py-0.5 rounded-full bg-red-100 text-red-600 shrink-0">부족</span>
                    </div>
                    <p id="stock-ez-note" class="hidden text-[11px] text-slate-400 leading-snug -mt-1"></p>

                    <!-- 사용량 예측(매일 08:30 앱\비품재고연동\발주알림.py) — 내용은 js/supplies.js renderForecastBox 가 그린다 -->
                    <div id="fc-box" class="hidden bg-white border border-slate-200 rounded-xl p-3 space-y-2 text-[12px] text-slate-600 min-w-0 break-words"></div>

                    <div class="bg-white border border-slate-200 rounded-xl p-3 space-y-2.5">
                        <div class="text-xs font-bold text-slate-600">재고 조정</div>
                        <div class="grid grid-cols-3 gap-1.5 text-xs font-bold">
                            <label class="flex items-center justify-center gap-1 p-2 border border-slate-300 rounded-lg cursor-pointer bg-white"><input type="radio" name="stock-op" value="in" checked> 입고(+)</label>
                            <label class="flex items-center justify-center gap-1 p-2 border border-slate-300 rounded-lg cursor-pointer bg-white"><input type="radio" name="stock-op" value="out"> 사용(−)</label>
                            <label class="flex items-center justify-center gap-1 p-2 border border-slate-300 rounded-lg cursor-pointer bg-white"><input type="radio" name="stock-op" value="set"> 실사(=)</label>
                        </div>
                        <div>
                            <label class="lbl" for="stock-qty">수량</label>
                            <input id="stock-qty" type="number" min="0" class="inp num" placeholder="0">
                        </div>
                        <div>
                            <label class="lbl" for="stock-memo">메모 (선택)</label>
                            <input id="stock-memo" class="inp" placeholder="예: ○○포장 입고분">
                        </div>
                        <div class="text-xs text-slate-500">조정 후 예상 재고: <b id="stock-preview" class="text-indigo-600">-</b></div>
                        <p id="stock-import-note" class="hidden text-[11px] leading-relaxed text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg p-2"></p>
                        <p id="stock-panel-error" class="hidden text-xs text-red-600 font-bold"></p>
                        <button type="button" id="btn-save-stock" class="w-full px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold">재고 반영</button>
                    </div>

                    <button type="button" id="btn-stock-excel" title="현재고조회 엑셀을 올리면 가장 최근 재고로 '실사' 조정을 채워 둡니다"
                        class="w-full text-xs font-bold px-3 py-2 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100">엑셀로 재고 맞추기</button>

                </div>
            </aside>

            <!-- 재고 변동 이력 — 별도 칸. md 이상에서는 안쪽을 absolute 로 띄워 칸 높이(상세 높이에 맞춰짐)만큼 스크롤된다. -->
            <aside id="stock-history-panel" class="hidden md:relative md:col-start-2 md:row-start-2 xl:col-start-3 xl:row-start-1 min-w-0 md:min-h-[220px] border-t xl:border-t-0 md:border-l border-slate-200 bg-slate-50">
                <div class="p-5 flex flex-col gap-2 md:absolute md:inset-0">
                    <div class="text-xs font-bold text-slate-600">재고 변동 이력</div>
                    <div id="stock-log" class="flex-1 min-h-0 max-h-72 md:max-h-none overflow-y-auto space-y-1 bg-white border border-slate-200 rounded-xl p-2"></div>
                </div>
            </aside>
            </div>
        </div>
    </div>

    <script type="module" src="js/supplies.js?v=202610271255"></script>
    <script type="module" src="js/page-gate.js?v=202610271255" data-perm-page="supplies.view"></script>
    <script type="module" src="js/app-shell.js?v=202610271255"></script>
    <script src="js/connection-banner.js?v=202610271255"></script>
    <script src="js/modal-esc.js?v=202610271255"></script>
    <script type="module" src="js/modal-drag.js?v=202610271255"></script>
</body>
