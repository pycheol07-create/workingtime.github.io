    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <link rel="stylesheet" href="style.css?v=d1169bab0d32-e526f5e4">
    <link rel="stylesheet" href="calc-d.css?v=f05a5038fb16-36a710e7">
    <!-- 공통 상단바 (메뉴는 대시보드에서 채운 캐시. 로그인 상태는 logis-defaults.js 가 uid 만 넘긴다 — data-shell-ctx="none" 이라 확인 전에도 캐시 메뉴를 보인다) -->
    <link rel="stylesheet" href="../css/app-shell.css?v=5966338d2f36-2dcf6c28">
    <script type="module" src="../js/modal-drag.js?v=c3010af0cdbe-22d0d415"></script>
    <!-- 로그인 게이트(2026-10-22, 2026-10-23 외부 열람) — 로그아웃이면 로그인 칸, 퇴사자는 막음(명단 밖 로그인 사용자는 보기 전용 설정으로 통과). 통과해야 app.js 가 계산기를 그린다. 기능 권한 가드(page-gate.js)는 넣지 않는다 -->
    <script type="module" src="auth-gate.js?v=6494c0e76be9-a91dd94b"></script>
    <script type="module" src="../js/app-shell.js?v=35b757f86d20-1454a9a2"></script>
    <!-- 보던 계산기 탭을 주소 뒤 해시(#tab=customs …)에 기억 — app.js 가 window.HashState 로 쓴다(UI 1단계 1c) -->
    <script type="module" src="../js/hash-state.js?v=41d515385973-40fe10fb"></script>
</head>
<body id="calc-root" class="bg-slate-100" data-shell="calculator" data-shell-ctx="none">
    <div id="root"></div>

    <!-- 숫자 칸 공통 파서(쉼표 무시)·천 단위 표시 → window.CalcNum. 모듈은 DOMContentLoaded 전에 실행되고
         Babel 은 DOMContentLoaded 뒤에 아래 스크립트를 돌리므로 계산기 코드가 쓸 때는 이미 붙어 있다(InputControl.js parseNum) -->
    <script type="module">
        import * as CalcNum from '../js/lib/calc-num.js?v=4e850657faba-cf4af870';
        import * as CustomsFxrt from '../js/lib/customs-fxrt.js?v=6f4fd01ca297-2d03329b';
        import * as HsSearch from '../js/lib/hs-search.js?v=343b59eb88c0-af5ea94c';
        import * as CalcPackMap from '../js/lib/calc-pack-map.js?v=715f096a2c58-2c5faf71';
        import * as CustomsCost from '../js/lib/customs-cost.js?v=72e9af87d1bc-f9709c52';
        window.CalcNum = CalcNum;
        window.CustomsFxrt = CustomsFxrt;   // 관세청 고시환율 자동 채움 판정(app.js) — Firebase 없는 순수 함수라 여기서 붙인다
        window.HsSearch = HsSearch;         // [HS코드로 찾기] 검색·세율 판정(HsLookup.js·CustomsCalculator.js) — 순수 함수
        window.CalcPackMap = CalcPackMap;   // [패킹 불러오기] 목록 글자·칸 옮기기(PackPicker.js·통관비·창고료 탭) — 순수 함수
        window.CustomsCost = CustomsCost;   // 통관비 탭 계산식·입력 기본값(CustomsCalculator.js) — 순수 함수
    </script>
    <script type="text/babel" src="constants.js?v=7dcffce7a816-4c2615c7"></script>
    <!-- 통관비 기본값(logis 최근 패킹 20건 평균) — Firestore 에서 읽어 SettingsContext.js 에 넘긴다. Firebase 초기화는 firebase-init.js 한 곳 -->
    <script type="module" src="logis-defaults.js?v=411874477da3-9adbf746"></script>
    <!-- 관세청 고시환율(주간, 앱\고시환율 이 매일 2회 씀) — Firestore 에서 읽어 app.js 에 넘긴다 -->
    <script type="module" src="customs-fxrt-doc.js?v=fa752a076412-53e830a6"></script>
    <!-- HS 관세율(앱\HS관세율 이 연 1회 씀) — [HS코드로 찾기] 패널을 처음 열 때 읽는다(window.HsTariff) -->
    <script type="module" src="hs-tariff-doc.js?v=5638a73f031e-4138efe8"></script>
    <!-- [패킹 불러오기] 미입고 패킹 목록(시트 「패킹.송금관리」 Apps Script 가 씀) — 직원만 읽는다(window.__calcPackings) -->
    <script type="module" src="calc-packings.js?v=d868f856ccb7-2b0ce23f"></script>
    <!-- 팀 공용 설정(Firestore persistent_data/calculatorSettings) — 읽기·저장(트랜잭션)·변경 이력. 통관비 기본값 3개는 제외 -->
    <script type="module" src="shared-settings.js?v=e141833b7887-d82aa2e2"></script>
    <script type="text/babel" src="SettingsContext.js?v=6087bc52fddd-24bdcea7"></script>
    <script type="text/babel" src="AdminPage.js?v=ee6064d2f1c3-c4eff211"></script>

    <script type="text/babel" src="Icons.js?v=7da95854d7be-96efdfeb"></script>
    <script type="text/babel" src="InputControl.js?v=b0c614c5efa6-8bb9ccad"></script>
    <!-- 탭 공통: 입력값 기억(localStorage calc.inputs.v1.<탭>) · [결과 복사] · [입력 초기화] -->
    <script type="text/babel" src="CalcMemory.js?v=f13e94a4f0f3-3ec72c1a"></script>
    <script type="text/babel" src="LiveRateDisplay.js?v=e31b6cfccf10-9cd0f32c"></script>
    
    <script type="text/babel" src="EfficiencyAnalysis.js?v=d6500eda6ee8-10572e65"></script>

    <!-- 통관비·창고료 탭 [패킹 불러오기] 버튼·목록 — 두 계산기가 쓰므로 그보다 앞에 -->
    <script type="text/babel" src="PackPicker.js?v=562ebf8ff706-443caa4d"></script>
    <!-- 통관비 탭 [HS코드로 찾기] 패널 — CustomsCalculator.js 가 쓰므로 그보다 앞에 -->
    <script type="text/babel" src="HsLookup.js?v=6014ebcf13be-f3acea09"></script>
    <script type="text/babel" src="CustomsCalculator.js?v=8c104e73f91f-fe40012e"></script>
    <script type="text/babel" src="ImportCalculator.js?v=72c5f44b9330-0eabb469"></script>
    <script type="text/babel" src="ShippingCalculator.js?v=4774ec7d361c-323eb77c"></script>
    <script type="text/babel" src="WarehouseFeeCalculator.js?v=7ba769b77429-79423a96"></script>
    
    <script type="text/babel" src="app.js?v=68849e4dc5d6-7517bbe0"></script>

    <!-- 로그인 게이트(auth-gate.js)가 8초 안에 상태를 못 알리면(모듈·Firebase 를 못 받음) 빈 화면 대신 안내. 정상이면 아무것도 안 한다 -->
    <script>
        (function () {
            var NOTE_ID = 'calc-load-fail';
            var drop = function () { var n = document.getElementById(NOTE_ID); if (n) n.remove(); };
            window.addEventListener('calc-auth', drop);   // 늦게라도 게이트가 뜨면 안내를 걷는다
            setTimeout(function () {
                if (window.__calcAuth) return;
                var root = document.getElementById('root');
                if (!root || root.childElementCount) return;
                var el = document.createElement('div');
                el.id = NOTE_ID;
                el.setAttribute('role', 'alert');
                el.style.cssText = 'min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center;'
                    + 'font-family:var(--font-sans); color:var(--c-text);';
                el.innerHTML = '<div style="font-size:15px; font-weight:600; line-height:1.6;">계산기를 불러오지 못했습니다 — 인터넷 연결을 확인하고 새로고침해 주세요</div>'
                    + '<button type="button" style="padding:9px 18px; border:1px solid var(--c-line-strong); border-radius:999px; background:var(--c-surface); color:var(--c-text); font:600 14px var(--font-sans); cursor:pointer;">새로고침</button>';
                el.querySelector('button').addEventListener('click', function () { location.reload(); });
                root.appendChild(el);
            }, 8000);
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
</body>
</html>
