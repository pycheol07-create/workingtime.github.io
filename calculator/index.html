<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>통합계산기</title>
    
    <link rel="icon" href="data:,"> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="../js/theme-boot.js?v=202610261142"></script>
    <link rel="stylesheet" href="../css/suit.css?v=202610261142">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['SUIT', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'] } } } };</script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    
    <link rel="stylesheet" href="style.css?v=202610261142">
    <link rel="stylesheet" href="calc-d.css?v=202610261142">
    <!-- 공통 상단바 (메뉴는 대시보드에서 채운 캐시. 로그인 상태는 logis-defaults.js 가 uid 만 넘긴다 — data-shell-ctx="none" 이라 확인 전에도 캐시 메뉴를 보인다) -->
    <link rel="stylesheet" href="../css/app-shell.css?v=202610261142">
    <script type="module" src="../js/modal-drag.js?v=202610261142"></script>
    <!-- 로그인 게이트(2026-10-22, 2026-10-23 외부 열람) — 로그아웃이면 로그인 칸, 퇴사자는 막음(명단 밖 로그인 사용자는 보기 전용 설정으로 통과). 통과해야 app.js 가 계산기를 그린다. 기능 권한 가드(page-gate.js)는 넣지 않는다 -->
    <script type="module" src="auth-gate.js?v=202610261142"></script>
    <script type="module" src="../js/app-shell.js?v=202610261142"></script>
    <!-- 보던 계산기 탭을 주소 뒤 해시(#tab=customs …)에 기억 — app.js 가 window.HashState 로 쓴다(UI 1단계 1c) -->
    <script type="module" src="../js/hash-state.js?v=202610261142"></script>
</head>
<body id="calc-root" class="bg-slate-100" data-shell="calculator" data-shell-ctx="none">
    <div id="root"></div>

    <!-- 숫자 칸 공통 파서(쉼표 무시)·천 단위 표시 → window.CalcNum. 모듈은 DOMContentLoaded 전에 실행되고
         Babel 은 DOMContentLoaded 뒤에 아래 스크립트를 돌리므로 계산기 코드가 쓸 때는 이미 붙어 있다(InputControl.js parseNum) -->
    <script type="module">
        import * as CalcNum from '../js/lib/calc-num.js?v=202610261142';
        import * as CustomsFxrt from '../js/lib/customs-fxrt.js?v=202610261142';
        import * as HsSearch from '../js/lib/hs-search.js?v=202610261142';
        window.CalcNum = CalcNum;
        window.CustomsFxrt = CustomsFxrt;   // 관세청 고시환율 자동 채움 판정(app.js) — Firebase 없는 순수 함수라 여기서 붙인다
        window.HsSearch = HsSearch;         // [HS코드로 찾기] 검색·세율 판정(HsLookup.js·CustomsCalculator.js) — 순수 함수
    </script>
    <script type="text/babel" src="constants.js?v=202610261142"></script>
    <!-- 통관비 기본값(logis 3개월 평균) — Firestore 에서 읽어 SettingsContext.js 에 넘긴다. Firebase 초기화는 firebase-init.js 한 곳 -->
    <script type="module" src="logis-defaults.js?v=202610261142"></script>
    <!-- 관세청 고시환율(주간, 앱\고시환율 이 매일 2회 씀) — Firestore 에서 읽어 app.js 에 넘긴다 -->
    <script type="module" src="customs-fxrt-doc.js?v=202610261142"></script>
    <!-- HS 관세율(앱\HS관세율 이 연 1회 씀) — [HS코드로 찾기] 패널을 처음 열 때 읽는다(window.HsTariff) -->
    <script type="module" src="hs-tariff-doc.js?v=202610261142"></script>
    <!-- 팀 공용 설정(Firestore persistent_data/calculatorSettings) — 읽기·저장(트랜잭션)·변경 이력. 통관비 기본값 3개는 제외 -->
    <script type="module" src="shared-settings.js?v=202610261142"></script>
    <script type="text/babel" src="SettingsContext.js?v=202610261142"></script>
    <script type="text/babel" src="AdminPage.js?v=202610261142"></script>

    <script type="text/babel" src="Icons.js?v=202610261142"></script>
    <script type="text/babel" src="InputControl.js?v=202610261142"></script>
    <!-- 탭 공통: 입력값 기억(localStorage calc.inputs.v1.<탭>) · [결과 복사] · [입력 초기화] -->
    <script type="text/babel" src="CalcMemory.js?v=202610261142"></script>
    <script type="text/babel" src="LiveRateDisplay.js?v=202610261142"></script>
    
    <script type="text/babel" src="EfficiencyAnalysis.js?v=202610261142"></script>

    <!-- 통관비 탭 [HS코드로 찾기] 패널 — CustomsCalculator.js 가 쓰므로 그보다 앞에 -->
    <script type="text/babel" src="HsLookup.js?v=202610261142"></script>
    <script type="text/babel" src="CustomsCalculator.js?v=202610261142"></script>
    <script type="text/babel" src="ImportCalculator.js?v=202610261142"></script>
    <script type="text/babel" src="ShippingCalculator.js?v=202610261142"></script>
    <script type="text/babel" src="WarehouseFeeCalculator.js?v=202610261142"></script>
    
    <script type="text/babel" src="app.js?v=202610261142"></script>

    <!-- 로그인 게이트(auth-gate.js)가 8초 안에 상태를 못 알리면(모듈·Firebase 를 못 받음) 빈 화면 대신 안내. 정상이면 아무것도 안 한다 -->
    <script>
        (function () {
            var NOTE_ID = 'calc-load-fail';
            var drop = function () { var n = document.getElementById(NOTE_ID); if (n) n.remove(); };
            window.addEventListener('calc-auth', drop);   // 늦게라도 게이트가 뜨면 안내를 걷는다
            setTimeout(function () {
                if (window.__calcAuth) return;
                var root = document.getElementById('root');
                if (!root || root.childElementCount) return;
                var el = document.createElement('div');
                el.id = NOTE_ID;
                el.setAttribute('role', 'alert');
                el.style.cssText = 'min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center;'
                    + 'font-family:var(--font-sans); color:var(--c-text);';
                el.innerHTML = '<div style="font-size:15px; font-weight:600; line-height:1.6;">계산기를 불러오지 못했습니다 — 인터넷 연결을 확인하고 새로고침해 주세요</div>'
                    + '<button type="button" style="padding:9px 18px; border:1px solid var(--c-line-strong); border-radius:999px; background:var(--c-surface); color:var(--c-text); font:600 14px var(--font-sans); cursor:pointer;">새로고침</button>';
                el.querySelector('button').addEventListener('click', function () { location.reload(); });
                root.appendChild(el);
            }, 8000);
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
</body>
</html>
