<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2F62C9">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="업무관리">
    <title>물류팀 데이터 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // D안 차트 기본값 (이 페이지만 — index 메인 대시보드 차트에는 넣지 않는다). js/d-chart.js 의 값과 같게 유지.
        if (window.Chart) {
            const dark = document.documentElement.classList.contains('dark');
            Chart.defaults.font.family = "'SUIT', 'Noto Sans KR', 'Malgun Gothic', sans-serif";
            Chart.defaults.color = dark ? '#A9B0BA' : '#646B75';
            Chart.defaults.borderColor = dark ? '#2C323A' : '#E6E8EC';
        }
    </script>
    <!-- 팀 결산 보고 '화면 그대로 PDF' 저장용 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/suit.css?v=202610281554">
    <link rel="stylesheet" href="css/style.css?v=202610281554">
    <link rel="stylesheet" href="css/history-d.css?v=202610281554">
    <link rel="stylesheet" href="css/page-nav.css?v=202610281554">
    <link rel="stylesheet" href="css/form-d.css?v=202610281554">
    <link rel="stylesheet" href="css/app-shell.css?v=202610281554">
    <style>
        /* 💡 탭 전환 시 hidden 클래스가 충돌하는 문제 방지 */
        .hidden { display: none !important; }

        /* HTML/Body 스크롤 꼬임 및 모바일 높이 무너짐 방지 */
        html, body { 
            height: 100% !important; 
            margin: 0 !important; 
            padding: 0 !important; 
            overflow: hidden !important; 
        }
        body { 
            background-color: #F5F6F8;
            height: 100vh !important; /* 구형 기기 호환용 폴백(Fallback) */
            height: 100dvh !important; 
            display: flex; 
            flex-direction: column; 
        }
        html.dark body { background-color: #111418; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        
        #modals-container-history { 
            flex: 1 1 auto !important;
            width: 100% !important; 
            height: 100% !important; 
            display: flex !important; 
            flex-direction: column !important; 
        }
        
        /* 💡 화면 깜빡임 방지: 페이드인 효과 */
        #history-modal { 
            position: fixed !important; 
            inset: var(--as-h, 0px) 0 0 0 !important; /* 공통 상단바(css/app-shell.css --as-h) 아래부터 */
            display: flex !important; 
            flex-direction: column !important;
            background: var(--c-bg) !important; /* 토큰은 css/history-d.css 가 #history-modal 에 둔다 */
            width: 100vw !important; 
            height: calc(100vh - var(--as-h, 0px)) !important; 
            height: calc(100dvh - var(--as-h, 0px)) !important; 
            padding: 0 !important; 
            margin: 0 !important;
            z-index: 50 !important; 
            opacity: 0; 
            pointer-events: none;
            transition: opacity 0.4s ease-out; 
        }
        
        #history-modal.ready-show {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        
        #history-modal-content-box { 
            flex: 1 1 auto !important;
            width: 100% !important; 
            max-width: none !important; 
            height: 100% !important; 
            max-height: none !important; 
            border-radius: 0 !important; 
            box-shadow: none !important; 
            border: none !important;
            margin: 0 !important;
            display: flex !important;
            flex-direction: column !important;
        }
        
        /* 본문: 좌측 레일 | 기간 목록(트리) | [기간 바 / 콘텐츠] (UI 2단계 H2·H3, 2026-10-16)
           트리·기간 바는 기간을 안 쓰는 화면에서 숨는다(display:none → 그 칸·줄이 0 이 된다).
           📱 768px 이하는 components/modals-history.html 의 세로 배치(레일 ▾ / 기간 바 / 트리 펼침 / 콘텐츠)를 따른다. */
        #history-modal-content-box > .flex-grow {
            min-height: 0 !important;
            flex: 1 1 auto !important;
        }
        @media (min-width: 769px) {
            #history-modal-content-box > .flex-grow {
                display: grid !important;
                grid-template-columns: auto auto minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
                grid-template-areas: "nav tree bar" "nav tree main";
            }
            #history-section-nav { grid-area: nav; }
            #history-period-bar { grid-area: bar; }
            #history-global-sidebar { grid-area: tree; min-height: 0; }
            #history-main-content { grid-area: main; }
        }
        #history-global-sidebar {
            flex: 0 0 auto !important;
        }
        #history-main-content {
            flex: 1 1 auto !important;
            min-width: 0 !important;
            min-height: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
        }

        /* 💡 패널별 속성 분리 (rawdata-panel은 스크롤이 되면 안됩니다!) */
        #dashboard-panel, #productivity-panel, #staffing-panel, #rawdata-panel {
            min-height: 0 !important;
            flex: 1 1 auto !important;
        }
        #dashboard-panel, #productivity-panel, #staffing-panel {
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
        }
        #rawdata-panel {
            overflow: hidden !important; 
        }
        
        #toggle-history-fullscreen-btn, #close-history-btn, #history-modal-header { display: none !important; }

        /* 📱 components/modals-history.html 의 모바일 규칙(fixed·inset 0·100dvh)은 대시보드 안 모달용이다.
              이 창에서는 공통 상단바 아래의 #history-modal 안을 꽉 채우게 한다(바닥이 화면 밖으로 밀리지 않게). */
        @media (max-width: 768px) {
            body[data-shell] #history-modal-content-box {
                position: absolute !important; inset: 0 !important;
                height: auto !important; max-height: none !important;
            }
        }
    </style>
</head>
<body class="transition-colors duration-200" data-shell="history">
    <div id="toast-container" class="space-y-2 w-full max-w-xs"></div>

    <div id="modals-container-history" class="w-full h-full"></div>
    <div id="modals-container-history-popups"></div>
    <div id="modals-container-form-attendance"></div>
    <div id="modals-container-form-record"></div>
    <div id="modals-container-form-quantity"></div>
    <div id="modals-container-form-team"></div>
    <div id="modals-container-form-inspection"></div>
    <div id="modals-container-form-total-inspection"></div> 
    <div id="modals-container-download"></div>
    <div id="modals-container-confirm"></div>
    
    <script>
        // 화면 조각·스크립트를 못 받았을 때(대개 인터넷) 빈 화면 대신 보이는 빨간 안내.
        // 데이터 관리 창(#history-modal)이 화면 전체를 덮으므로 위에 떠 있게 고정하고, 한 번만 띄운다.
        // 인터넷이 끊기면 tailwind(CDN)도 없을 수 있어 스타일은 직접 적는다.
        function showLoadFailNotice(parent, prepend) {
            if (document.getElementById('history-load-fail-notice')) return;
            var box = document.createElement('div');
            box.id = 'history-load-fail-notice';
            box.setAttribute('role', 'alert');
            box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:100000;padding:12px 16px;border:1px solid #FCA5A5;border-radius:12px;background:#FEF2F2;color:#B91C1C;font-weight:700;font-size:14px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.12);';
            box.textContent = '화면 일부를 불러오지 못했습니다(인터넷 연결 확인). 새로고침해 주세요.';
            if (!parent) parent = document.body;
            if (prepend) parent.prepend(box); else parent.appendChild(box);
        }

        async function loadComponent(url, containerId) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const html = await response.text();
                document.getElementById(containerId).innerHTML = html;
            } catch (error) {
                console.error("컴포넌트 로딩 실패:", error);
                showLoadFailNotice(document.getElementById(containerId), false);
            }
        }

        async function initHistoryApp() {
            await Promise.all([
                loadComponent('components/modals-history.html', 'modals-container-history'),
                loadComponent('components/modals-history-popups.html', 'modals-container-history-popups'),
                loadComponent('components/modals-confirm.html', 'modals-container-confirm'),
                // ⚠️ 예전의 modals-form.html 은 아래 6개 파일로 쪼개졌는데 여기만 옛 이름을 부르고 있었다.
                // 그래서 데이터 관리 창에는 처리량 수정·근태 기록·업무 기록 수정 모달의
                // 마크업이 통째로 없었고, 버튼을 눌러도 아무 일이 일어나지 않았다.
                loadComponent('components/modals-form-attendance.html', 'modals-container-form-attendance'),
                loadComponent('components/modals-form-record.html', 'modals-container-form-record'),
                loadComponent('components/modals-form-quantity.html', 'modals-container-form-quantity'),
                loadComponent('components/modals-form-team.html', 'modals-container-form-team'),
                loadComponent('components/modals-form-inspection.html', 'modals-container-form-inspection'),
                loadComponent('components/modals-form-total-inspection.html', 'modals-container-form-total-inspection')
            ]);

            try {
                const State = await import('./js/state.js?v=202610281554');
                try { await import('./js/app.js?v=202610281554'); } catch(e) {} 
                
                const { loadAndRenderHistoryList } = await import('./js/app-history-logic.js?v=202610281554');
                const { restoreHistoryView } = await import('./js/view-state.js?v=202610281554');
                const { showSection } = await import('./js/listeners-history-tabs.js?v=202610281554');

                const revealModal = () => {
                    const modal = document.getElementById('history-modal');
                    if (modal) {
                        modal.classList.remove('hidden');
                        modal.classList.add('ready-show');
                    }
                };

                // 첫 화면(H1, 2026-10-16): loadAndRenderHistoryList 가 업무 이력·일별·가장 최근 날짜까지 그려 둔 뒤라
                // 바로 기억해 둔 자리(해시 → sessionStorage, js/view-state.js)로 가고, 없으면 '요약'(종합 인사이트)을 연다.
                // 예전의 100ms 폴링('업무 기록 및 관리' → 숨은 '일별 상세' 글자 찾기 → 첫 날짜 → 복원)을 직접 호출로 바꿨다.
                const triggerInitialUI = async () => {
                    // 💡 [안전장치] 0.3초 뒤 무조건 화면을 표시하여 투명한 상태에 영원히 갇히는 현상 방지
                    const safety = setTimeout(revealModal, 300);
                    try {
                        let restored = false;
                        try { restored = await restoreHistoryView(); } catch (e) { console.error('화면 복원 실패:', e); }
                        if (!restored) await showSection('insight');
                    } catch (e) {
                        console.error("첫 화면 표시 오류:", e);
                    }
                    clearTimeout(safety);
                    revealModal();
                };

                // 🔒 데이터 관리는 관리자 전용(대시보드 버튼도 관리자만 보인다 — app.js adminElements).
                //    버튼을 숨겨도 주소를 직접 치면 열리므로 여기서도 막는다. 역할은 app.js 가 로그인 뒤 currentUser 와 함께 넣는다
                //    (currentUserRole 의 초기값이 'user' 라 역할 값으로는 준비 여부를 알 수 없다 — currentUser 로 기다린다).
                //    ※ 화면 문지기다. 데이터 자체는 Firestore 규칙(artifacts/** 읽기 = 로그인 전원)을 따른다.
                const adminOnly = () => {
                    if (State.appState.currentUserRole === 'admin') return true;
                    alert('데이터 관리 화면은 지금 관리자만 들어갈 수 있습니다(일반 직원에게 데이터 관리 기능을 줘도 아직 효과가 없습니다).');   // 문구: js/lib/perm-gate.js DATA_ADMIN_ONLY_NOTE
                    leavePage();
                    return false;
                };
                // 새 탭(대시보드에서 연 창)이면 닫고, 닫기가 막힌 창이면 메인으로 보낸다(대시보드가 두 탭에서 돌지 않게).
                const leavePage = () => {
                    if (window.opener) { try { window.close(); } catch (e) {} }
                    setTimeout(() => location.replace('index.html'), 300);
                };
                // 로그인 뒤 사용자 정보가 끝내 안 들어오면(미등록·퇴사 signOut, 시작 중 오류) 무한 대기하지 않는다.
                let userWait = null;
                const waitUser = (onReady) => {
                    if (userWait) clearInterval(userWait);
                    let tries = 0;
                    userWait = setInterval(async () => {
                        if (State.appConfig && Object.keys(State.appConfig).length > 0 && State.appState && State.appState.currentUser) {
                            clearInterval(userWait); userWait = null;
                            if (!adminOnly()) return;
                            await onReady();
                        } else if (++tries > 150) {
                            clearInterval(userWait); userWait = null;
                            alert('사용자 정보를 확인하지 못했습니다. 메인 화면에서 다시 로그인해 주세요.');
                            leavePage();
                        }
                    }, 100);
                };

                let checkCount = 0;
                const waitForAuth = setInterval(async () => {
                    if (State.auth && typeof State.auth.onAuthStateChanged === 'function') {
                        clearInterval(waitForAuth);
                        
                        State.auth.onAuthStateChanged(async (user) => {
                            if (!user) {
                                if (userWait) { clearInterval(userWait); userWait = null; }
                                alert("로그인이 필요합니다. 메인 대시보드 창에서 먼저 로그인해주세요.");
                                leavePage();
                                return;
                            }

                            waitUser(async () => {
                                revealModal();   // '이력 로딩 중...' 틀을 먼저 보인다(조회가 끝날 때까지 빈 화면이지 않게)
                                await loadAndRenderHistoryList();
                                
                                const modal = document.getElementById('history-modal');
                                if (modal) modal.classList.remove('hidden');

                                triggerInitialUI();
                            });
                        });
                    }
                    
                    if (checkCount > 30) {
                        clearInterval(waitForAuth);
                        if (!State.appState || !State.appState.currentUser) {
                             alert("로그인 정보를 찾을 수 없습니다.");
                             leavePage();
                             return;
                        }
                        
                        waitUser(async () => {
                            revealModal();   // '이력 로딩 중...' 틀을 먼저 보인다
                            await loadAndRenderHistoryList();
                            
                            const modal = document.getElementById('history-modal');
                            if (modal) modal.classList.remove('hidden');
                            
                            triggerInitialUI();
                        });
                    }
                    checkCount++;
                }, 100);

            } catch (e) {
                console.error("데이터 관리 스크립트 로딩 실패:", e);
                showLoadFailNotice(document.body, true);
            }
        }

        initHistoryApp();
    </script>
    <script src="js/connection-banner.js?v=202610281554"></script>
    <script src="js/modal-esc.js?v=202610281554"></script>
    <script type="module" src="js/modal-drag.js?v=202610281554"></script>
    <script type="module" src="js/page-gate.js?v=202610281554" data-perm-page="data.view"></script>
    <script type="module" src="js/app-shell.js?v=202610281554"></script>
</body>
</html>
