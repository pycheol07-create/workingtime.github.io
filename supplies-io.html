<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="js/theme-boot.js?v=cc87c43d70fe-c7b53f24"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <title>비품 입·출고</title>
    <!-- 비품 입·출고(2026-11-26 비품관리 앱 기준 전환 3단계 · 2026-11-27 공유 누적) — 휴대폰으로 비품을 골라(검색·초성·바코드·자주 쓰는 것·목록 드롭다운)
         단위 단추를 누르면 공유 누적 칸(suppliesIoCart/{입고·출고}-{비품 id}, 모든 사람이 실시간으로 같은 칸)에 바로 더하고,
         [출고 전송]/[입고 전송]은 고른 비품 칸만 원장에 쓰고 비운다(한 트랜잭션 — js/supplies-ledger-store.js cartSend). 다른 비품 칸은 그대로.
         단위 단추를 누를 때마다 내가 누른 비품의 누적을 음성으로 읽는다(늘 켬, 지원 안 되는 기기는 조용히). 스위치 persistent_data/suppliesSettings.ledgerLive 가 켜져 있을 때만 받는다.
         계산은 js/lib/supplies-io.js(시험 tests/supplies-io.test.js), 화면 시험 tools/supplies-io-check.py. -->
    <link rel="stylesheet" href="css/suit.css?v=46e3de7a3d1d-51b336f8">
    <link rel="stylesheet" href="css/d-theme.css?v=953f526a14fe-f287cc85">
    <link rel="stylesheet" href="css/supplies-io.css?v=4d7ef23aa45e-6f2ae4f6">
    <link rel="stylesheet" href="css/app-shell.css?v=5966338d2f36-2dcf6c28">
</head>
<body data-shell="supplies">
    <div id="si-loading" class="si-loading">불러오는 중…</div>

    <div id="si-gate" class="si-wrap" hidden>
        <div class="d-card si-pad si-center">
            <b>로그인이 필요합니다</b>
            <p class="t-2">메인 앱(업무관리)에서 먼저 로그인한 뒤 이 페이지를 열어 주세요.</p>
        </div>
    </div>

    <main id="si-main" class="si-wrap" hidden>
        <div class="si-top">
            <nav id="si-dir" class="d-seg si-seg" aria-label="입고·출고">
                <button type="button" class="d-seg-btn is-on" data-dir="out" aria-pressed="true">출고</button>
                <button type="button" class="d-seg-btn" data-dir="in" aria-pressed="false">입고</button>
            </nav>
            <div class="si-grow"></div>
            <button type="button" id="si-hist-btn" class="d-btn" aria-pressed="false" aria-controls="si-hist" title="보낸 입고·출고 기록 보기·되돌리기">전송 기록</button>
            <button type="button" id="si-scan" class="d-btn" aria-pressed="false" title="휴대폰 카메라로 바코드 읽기">스캔</button>
        </div>

        <!-- 스위치가 꺼져 있거나 못 읽었을 때 — 입·출고를 받지 않는다 -->
        <div id="si-off" class="si-alert warn" role="status" hidden></div>
        <!-- 꺼짐일 때 남은 누적 칸 — 비우기만(다시 켰을 때 옛 칸이 전송되지 않게) -->
        <div id="si-off-left" class="d-card si-pad" hidden></div>
        <div id="si-error" class="si-alert risk" role="alert" hidden></div>

        <div id="si-work" hidden>
            <div id="si-reader-wrap" class="si-reader-wrap" hidden>
                <div id="si-reader" class="si-reader"></div>
                <p class="si-small t-2">바코드를 네모 안에 비추세요. 읽으면 바로 고릅니다.</p>
            </div>

            <!-- 비품 고르기 -->
            <section class="d-card si-pad" aria-labelledby="si-pick-title">
                <h2 id="si-pick-title" class="si-h">비품 고르기</h2>
                <input id="si-search" class="si-input" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                       placeholder="이름 일부 · 초성(ㄱㄴ) · 바코드" aria-label="비품 찾기(이름·초성·바코드)" aria-controls="si-results">
                <div id="si-results" class="si-results" role="list" hidden></div>
                <select id="si-select" class="si-input si-select" aria-label="목록에서 비품 고르기">
                    <option value="">목록에서 고르기</option>
                </select>
                <p id="si-msg" class="si-msg" role="status" aria-live="polite" hidden></p>
                <div id="si-favs-wrap" class="si-favs-wrap">
                    <div class="si-small t-2">자주 쓰는 것</div>
                    <div id="si-favs" class="si-favs"></div>
                </div>
            </section>

            <!-- 고른 비품 카드 — 단위 단추를 누를 때마다 공유 누적 칸(suppliesIoCart)에 바로 더한다. [전송] = 이 비품 칸만 원장에 쓰고 비움 -->
            <section id="si-card" class="d-card si-pad si-card" aria-live="polite" hidden>
                <div class="si-card-head">
                    <b id="si-card-name" class="si-card-name"></b>
                    <div class="si-grow"></div>
                    <button type="button" id="si-reset" class="d-btn d-btn-sm" title="이 비품 누적 칸 비우기(모두에게 비워짐)">비우기</button>
                    <button type="button" id="si-change" class="d-btn d-btn-sm">바꾸기</button>
                </div>
                <div id="si-card-stock" class="si-card-stock num"></div>
                <div id="si-card-who" class="si-small t-2"></div>
                <div id="si-units" class="si-units"></div>
                <div id="si-calc" class="si-calc num"></div>
                <div id="si-add-why" class="si-small t-2" role="status" aria-live="polite"></div>
                <button type="button" id="si-save" class="d-btn d-btn-primary si-big">출고 전송</button>
                <div id="si-save-why" class="si-small t-2"></div>
            </section>

            <div id="si-result" class="si-result" role="status" aria-live="polite" hidden></div>

            <!-- 누적 — 모든 사람이 같이 보는 비품별 칸(이 방향만). 고른 비품은 강조, 다른 비품 줄을 누르면 그 비품으로 이어서 -->
            <section class="d-card si-pad si-acc-sec" aria-labelledby="si-acc-title">
                <h2 id="si-acc-title" class="si-h">누적</h2>
                <ul id="si-acc" class="si-acc-list"></ul>
                <div id="si-acc-other" class="si-small t-2" hidden></div>
            </section>

            <!-- 전송 기록(2026-11-27) — 이 화면이 보낸 입고·출고(원장 suppliesLedger, batchId 있는 것). 기본 오늘·어제, [7일 보기]. [되돌리기] = 비품 관리와 같은 원장 되돌림(commitRevert) -->
            <section id="si-hist" class="d-card si-pad si-hist" aria-labelledby="si-hist-title" hidden>
                <div class="si-card-head">
                    <h2 id="si-hist-title" class="si-h">전송 기록</h2>
                    <div class="si-grow"></div>
                    <button type="button" id="si-hist-close" class="d-btn d-btn-sm">닫기</button>
                </div>
                <nav id="si-hist-who" class="d-seg si-seg" aria-label="누구 기록">
                    <button type="button" class="d-seg-btn is-on" data-hist-who="all" aria-pressed="true">전체</button>
                    <button type="button" class="d-seg-btn" data-hist-who="mine" aria-pressed="false">내 기록</button>
                </nav>
                <div id="si-hist-range" class="si-small t-2"></div>
                <ul id="si-hist-list" class="si-acc-list"></ul>
                <p id="si-hist-msg" class="si-msg" role="status" aria-live="polite"></p>
                <button type="button" id="si-hist-more" class="d-btn si-big" hidden>7일 보기</button>
            </section>
        </div>
    </main>

    <script src="js/connection-banner.js?v=fb04e0b435ed-f6d55014"></script>
    <script src="js/modal-esc.js?v=0458b4470d9a-71e98692"></script>
    <script type="module" src="js/supplies-io.js?v=a29c50f846da-0029a514"></script>
    <script type="module" src="js/page-gate.js?v=91ff5d6d21f9-d1e977d0" data-perm-page="supplies.view"></script>
    <script type="module" src="js/app-shell.js?v=0ad2923a7c3b-bf6553e1"></script>
</body>
</html>
