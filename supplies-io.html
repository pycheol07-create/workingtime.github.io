<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="js/theme-boot.js?v=cc87c43d70fe-c7b53f24"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <title>비품 입·출고</title>
    <!-- 비품 입·출고(2026-11-26 비품관리 앱 기준 전환 3단계) — 휴대폰으로 비품을 골라(검색·초성·바코드·자주 쓰는 것) 단위 단추로 수량을 쌓고
         목록에 모아 한 번에 저장한다(원장 js/supplies-ledger-store.js commitLines). 스위치 persistent_data/suppliesSettings.ledgerLive 가 켜져 있을 때만 받는다.
         계산은 js/lib/supplies-io.js(시험 tests/supplies-io.test.js), 화면 시험 tools/supplies-io-check.py. -->
    <link rel="stylesheet" href="css/suit.css?v=46e3de7a3d1d-51b336f8">
    <link rel="stylesheet" href="css/d-theme.css?v=953f526a14fe-f287cc85">
    <link rel="stylesheet" href="css/supplies-io.css?v=2fa7f4fbe888-46f94d1e">
    <link rel="stylesheet" href="css/app-shell.css?v=5966338d2f36-2dcf6c28">
</head>
<body data-shell="supplies">
    <div id="si-loading" class="si-loading">불러오는 중…</div>

    <div id="si-gate" class="si-wrap" hidden>
        <div class="d-card si-pad si-center">
            <b>로그인이 필요합니다</b>
            <p class="t-2">메인 앱(업무관리)에서 먼저 로그인한 뒤 이 페이지를 열어 주세요.</p>
        </div>
    </div>

    <main id="si-main" class="si-wrap" hidden>
        <div class="si-top">
            <nav id="si-dir" class="d-seg si-seg" aria-label="입고·출고">
                <button type="button" class="d-seg-btn is-on" data-dir="out" aria-pressed="true">출고</button>
                <button type="button" class="d-seg-btn" data-dir="in" aria-pressed="false">입고</button>
            </nav>
            <div class="si-grow"></div>
            <button type="button" id="si-scan" class="d-btn" aria-pressed="false" title="휴대폰 카메라로 바코드 읽기">스캔</button>
        </div>

        <!-- 스위치가 꺼져 있거나 못 읽었을 때 — 입·출고를 받지 않는다 -->
        <div id="si-off" class="si-alert warn" role="status" hidden></div>
        <div id="si-error" class="si-alert risk" role="alert" hidden></div>

        <div id="si-work" hidden>
            <div id="si-reader-wrap" class="si-reader-wrap" hidden>
                <div id="si-reader" class="si-reader"></div>
                <p class="si-small t-2">바코드를 네모 안에 비추세요. 읽으면 바로 고릅니다.</p>
            </div>

            <!-- 비품 고르기 -->
            <section class="d-card si-pad" aria-labelledby="si-pick-title">
                <h2 id="si-pick-title" class="si-h">비품 고르기</h2>
                <input id="si-search" class="si-input" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                       placeholder="이름 일부 · 초성(ㄱㄴ) · 바코드" aria-label="비품 찾기(이름·초성·바코드)" aria-controls="si-results">
                <div id="si-results" class="si-results" role="list" hidden></div>
                <p id="si-msg" class="si-msg" role="status" aria-live="polite" hidden></p>
                <div id="si-favs-wrap" class="si-favs-wrap">
                    <div class="si-small t-2">자주 쓰는 것</div>
                    <div id="si-favs" class="si-favs"></div>
                </div>
            </section>

            <!-- 고른 비품 카드 -->
            <section id="si-card" class="d-card si-pad si-card" aria-live="polite" hidden>
                <div class="si-card-head">
                    <b id="si-card-name" class="si-card-name"></b>
                    <div class="si-grow"></div>
                    <button type="button" id="si-reset" class="d-btn d-btn-sm">다시</button>
                    <button type="button" id="si-change" class="d-btn d-btn-sm">바꾸기</button>
                </div>
                <div id="si-card-stock" class="si-card-stock num"></div>
                <div id="si-units" class="si-units"></div>
                <div id="si-calc" class="si-calc num"></div>
                <button type="button" id="si-add" class="d-btn d-btn-primary si-big">출고</button>
                <div id="si-add-why" class="si-small t-2"></div>
            </section>

            <!-- 저장 전 목록 -->
            <section class="d-card si-pad" aria-labelledby="si-list-title">
                <h2 id="si-list-title" class="si-h"></h2>
                <ul id="si-list" class="si-list"></ul>
                <div id="si-result" class="si-result" role="status" aria-live="polite" hidden></div>
                <button type="button" id="si-save" class="d-btn d-btn-primary si-big">저장 및 전송 (0건)</button>
                <div id="si-save-why" class="si-small t-2"></div>
            </section>
        </div>
    </main>

    <script src="js/connection-banner.js?v=fb04e0b435ed-f6d55014"></script>
    <script src="js/modal-esc.js?v=0458b4470d9a-71e98692"></script>
    <script type="module" src="js/supplies-io.js?v=d49aba34983c-ebcd578c"></script>
    <script type="module" src="js/page-gate.js?v=91ff5d6d21f9-d1e977d0" data-perm-page="supplies.view"></script>
    <script type="module" src="js/app-shell.js?v=0ad2923a7c3b-bf6553e1"></script>
</body>
</html>
