<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="js/theme-boot.js?v=202610281554"></script>
    <link rel="stylesheet" href="css/suit.css?v=202610281554">
    <link rel="stylesheet" href="css/d-theme.css?v=202610281554">
    <link rel="stylesheet" href="css/app-shell.css?v=202610281554">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>입고 스캐너</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        /* 화면 확대(두 손가락)는 허용하되, 버튼·카메라 영역을 빠르게 두 번 눌러도 확대되지 않게 (스캔 버튼 오조작 방지) */
        button, .scan-wrap, .overlay { touch-action: manipulation; }
        body { margin: 0; font-family: 'SUIT', 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: var(--c-bg); color: var(--c-text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        .tabs { display: flex; gap: 8px; padding: 10px 12px 6px; background: var(--theme, #2F62C9); align-items: center; }
        .tab { flex: 1; text-align: center; padding: 10px 0; border: 0; background: transparent; font-family: inherit; border-radius: var(--r-pill); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
        .tab.active { background: var(--c-surface); color: var(--c-text); }
        /* 키보드 포커스 표시 — 파란 머리줄 위라 흰 링 (공통 :focus-visible 은 css/d-theme.css) */
        .tabs .tab:focus-visible, .tabs .btn-gear:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .btn-gear { background: none; border: none; font-size: 22px; color: #fff; cursor: pointer; padding: 4px 6px; }
        .status-line { background: rgba(0,0,0,0.25); color: #fff; text-align: center; font-size: 13px; font-weight: bold; padding: 4px 0; }

        /* [Ver 3.7] 카메라가 남은 화면 전체를 채움 (스캔 목록은 카메라 위에 오버레이) */
        .scan-wrap { position: relative; background: #000; flex: 1; min-height: 0; overflow: hidden; }
        #reader { width: 100%; height: 100%; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
        .btn-start { position: absolute; inset: 0; margin: auto; width: 220px; height: 64px; background: var(--c-accent); color: #fff; border: none; border-radius: var(--r-pill); font-size: 19px; font-weight: 700; cursor: pointer; z-index: 5; }
        .cam-controls { display: none; position: absolute; right: 8px; top: 8px; z-index: 8; gap: 6px; align-items: center; background: rgba(0,0,0,0.45); border-radius: 24px; padding: 5px 10px; }
        .cam-controls button { background: none; border: none; font-size: 22px; color: #fff; cursor: pointer; padding: 2px 6px; opacity: 0.85; }
        .cam-controls #zoom-label { color: #fff; font-size: 13px; font-weight: bold; min-width: 36px; text-align: center; }

        .loc-banner { padding: 12px 15px; font-size: 17px; font-weight: 800; background: var(--c-warn-soft); color: var(--c-warn-text); display: none; }
        .loc-banner.fixed { background: var(--c-ok-soft); color: var(--c-ok-text); }
        /* (2026-10-16) 기존재고 모드는 헷갈리지 않게 배너·버튼을 다른 색으로 — 당일 입고분을 기존재고로 찍는 실수 방지 */
        .loc-banner.existing { background: #A0525C; color: #fff; }
        .qtag-ex { display: inline-block; padding: 0 6px; border-radius: 4px; background: #A0525C; color: #fff; font-weight: 800; font-size: 12px; margin-right: 4px; }

        /* [Ver 4.1] 위치 모드 세부 작업 선택 (당일 입고분 / 기존재고) */
        .loc-submode { display: none; gap: 6px; padding: 8px 10px 0; background: var(--c-bg); }
        .loc-submode button { flex: 1; padding: 10px 0; border: 1px solid var(--c-line-strong); border-radius: var(--r-pill); background: var(--c-surface); color: var(--c-text-2); font-size: 14px; font-weight: 700; cursor: pointer; }
        .loc-submode button.active { border-color: #3D756F; background: #3D756F; color: #fff; }
        .loc-submode button[data-sub="existing"].active { border-color: #A0525C; background: #A0525C; }

        /* [Ver 3.9] 탭-투-포커스 표시 링 + 수동 촬영 버튼 */
        .focus-ring { position: fixed; width: 74px; height: 74px; margin: -37px 0 0 -37px; border: 3px solid #fff; border-radius: 10px; z-index: 9; pointer-events: none; box-shadow: 0 0 8px rgba(0,0,0,0.5); animation: focuspulse 0.7s ease-out forwards; }
        @keyframes focuspulse { 0% { transform: scale(1.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        .btn-capture { display: none; position: absolute; left: 14px; bottom: 14px; z-index: 8; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; background: rgba(0,0,0,0.45); color: #fff; font-size: 26px; cursor: pointer; }
        .btn-capture:active { background: rgba(255,255,255,0.3); }

        /* [Ver 3.7] 스캔 목록: 카메라 위 반투명 오버레이 (내역 있을 때만 표시) */
        .queue { display: none; position: absolute; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom)); max-height: 45%; overflow-y: auto; padding: 6px 8px; z-index: 7; }
        .qitem { background: rgba(255,255,255,0.93); border: 1px solid var(--c-line); border-radius: var(--r-sm); padding: 8px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .qinfo { flex: 1; min-width: 0; }
        .qcode { font-size: 18px; font-weight: 800; }
        .qsub { font-size: 14px; color: var(--c-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qqty { font-size: 17px; font-weight: 800; color: var(--c-accent-deep); white-space: nowrap; }
        .qdel { background: none; border: none; font-size: 20px; color: var(--c-risk-text); cursor: pointer; padding: 4px; }
        .empty-msg { text-align: center; color: var(--c-text-3); padding: 40px 0; font-size: 14px; }

        .send-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--c-bg); border-top: 1px solid var(--c-line); }
        .btn-send { width: 100%; height: 58px; border: none; border-radius: var(--r-pill); background: var(--theme, #2F62C9); color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; }
        .btn-send:disabled { background: var(--c-track); color: var(--c-text-3); }
        /* 모바일: 전송 막대를 흐름 안으로 넣어 카메라 영역이 막대 위에서 끝나게 함(촬영 버튼이 막대에 가리지 않음).
           목록은 촬영 버튼(bottom 14 + 높이 60) 위로 10px 띄움 = 84px */
        @media (hover: none), (max-width: 768px) {
            .send-bar { position: static; flex-shrink: 0; }
            .queue { bottom: 84px; }
            .qdel { padding: 8px 10px; }
        }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(30,40,60,.45); z-index: 100; justify-content: center; align-items: center; padding: 18px; }
        .modal { background: var(--c-surface); border-radius: var(--r-card); padding: 20px; width: 100%; max-width: 360px; max-height: 85dvh; overflow-y: auto; }
        .m-code { font-size: 26px; font-weight: 800; color: var(--c-accent-deep); text-align: center; word-break: break-all; }
        .m-loc { font-size: 21px; font-weight: 800; text-align: center; margin-top: 4px; }
        .m-remain { text-align: center; margin: 8px 0; font-size: 15px; }
        .m-remain b { font-size: 34px; color: var(--c-risk-text); }
        .m-btn { width: 100%; height: 58px; margin-top: 8px; border: none; border-radius: var(--r-pill); background: var(--c-accent); color: #fff; font-size: 20px; font-weight: 700; cursor: pointer; }
        .m-btn.outline { background: var(--c-surface); color: var(--c-accent); border: 1px solid var(--c-accent); }
        .m-btn.gray { background: var(--c-surface); color: var(--c-text-2); border: 1px solid var(--c-line-strong); font-size: 16px; height: 46px; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
        .numpad button { height: 52px; font-size: 20px; font-weight: 800; border: 1px solid var(--c-line); border-radius: var(--r-sm); background: var(--c-surface-2); cursor: pointer; }
        .num-display { border: 2px solid var(--c-accent); border-radius: var(--r-sm); padding: 10px; font-size: 30px; font-weight: 900; text-align: right; }
        .qty-sel-label { font-size: 13px; font-weight: 800; color: var(--c-text-2); margin: 12px 0 5px; text-align: left; }
        .qty-sel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .qty-sel button { height: 52px; font-size: 22px; font-weight: 800; border: 1px solid var(--c-line); border-radius: var(--r-sm); background: var(--c-surface-2); cursor: pointer; }
        .qty-sel button.sel { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
        /* 미발수량 원탭 입고 버튼 (미발 1~999개일 때만 표시) */
        .m-btn.mibal { height: 64px; margin: 4px 0 6px; background: var(--c-risk-text); font-size: 22px; }
        /* 수량 직접 입력 키패드 */
        .numpad button.np-ok { background: var(--c-accent); color: #fff; border-color: var(--c-accent); font-size: 18px; }
        .numpad button.np-ok:disabled { background: var(--c-track); color: var(--c-text-3); border-color: var(--c-line); }
        .num-display:focus { outline: none; box-shadow: 0 0 0 3px var(--c-accent-soft, rgba(47,98,201,.25)); }
        .qty-mode-btn { width: 100%; min-height: 46px; margin-top: 10px; border: 1px dashed var(--c-line-strong); border-radius: var(--r-sm); background: var(--c-surface); color: var(--c-text-2); font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
        .set-desc { font-size: 12.5px; color: var(--c-text-2); line-height: 1.5; padding: 6px 0 10px; border-bottom: 1px solid var(--c-line-soft); }
        .set-row.has-desc { border-bottom: 0; padding-bottom: 0; }
        .set-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--c-line-soft); font-size: 14px; font-weight: bold; gap: 8px; }
        .set-row input[type="text"] { flex: 1; padding: 8px; border: 1px solid var(--c-line-strong); border-radius: var(--r-sm); font-size: 14px; }
        .set-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--c-accent); }

        #toast { visibility: hidden; position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--c-text); color: #fff; padding: 10px 18px; border-radius: var(--r-sm); font-size: 14px; z-index: 200; opacity: 0; transition: 0.3s; max-width: 90%; text-align: center; }
        #toast.show { visibility: visible; opacity: 1; }
        /* 스캔 목록 삭제 되돌리기(5초) — #toast 와 같은 자리, 버튼이 있어 따로 둔다 */
        #undo-toast { display: none; position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--c-text); color: #fff; padding: 8px 8px 8px 16px; border-radius: var(--r-sm); font-size: 15px; z-index: 201; max-width: 92%; align-items: center; gap: 12px; box-shadow: var(--sh-pop); }
        #undo-toast.show { display: flex; }
        #undo-toast button { flex-shrink: 0; min-height: 40px; padding: 0 16px; border: 0; border-radius: var(--r-pill); background: #fff; color: var(--c-accent-deep); font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
        #update-banner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: var(--c-warn-text); color: #fff; z-index: 300; padding: 12px; text-align: center; font-weight: bold; }
        #update-banner button { margin-left: 10px; padding: 6px 14px; border: none; border-radius: 6px; background: #fff; color: var(--c-warn-text); font-weight: bold; }

        /* ── 다크(2026-10-22) — 토큰은 css/d-theme.css html.dark. 여기는 토큰만으로 안 되는 곳 ──
           다크 토큰의 파랑·분홍·노랑은 밝아서 그 위 글자는 흰색 대신 어두운 색(#111418). */
        html.dark .btn-start, html.dark .m-btn, html.dark .qty-sel button.sel, html.dark .numpad button.np-ok { color: #111418; }
        html.dark .m-btn.outline { color: var(--c-accent); }
        html.dark .m-btn.gray { color: var(--c-text-2); }
        html.dark .numpad button.np-ok:disabled { color: var(--c-text-3); }
        html.dark .numpad button, html.dark .qty-sel button { color: var(--c-text); }
        html.dark .qitem { background: rgba(26,30,36,.93); }
        html.dark #toast, html.dark #undo-toast { background: #2A3038; color: var(--c-text); border: 1px solid var(--c-line-strong); }
        html.dark #undo-toast button { background: var(--c-accent); color: #111418; }
        html.dark #update-banner { color: #111418; }
        html.dark #update-banner button { background: #111418; color: var(--c-warn-text); }
        html.dark #btn-in-manual-code { color: #111418 !important; }   /* 인라인 style 위 */
        html.dark #loc-manual input, html.dark #in-manual input, html.dark .set-row input[type="text"] { background: var(--c-surface); color: var(--c-text); }
    </style>
</head>
<body data-shell="scan">
    <div id="update-banner"></div>

    <div class="tabs" id="tabs">
        <button type="button" class="tab active" id="tab-in" aria-pressed="true">입고</button>
        <button type="button" class="tab" id="tab-loc" aria-pressed="false">위치</button>
        <button class="btn-gear" id="btn-settings" aria-label="설정"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block; margin:4px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div class="status-line" id="status-line">-</div>
    <!-- [Ver 8.1] 오프라인 표시 -->
    <div id="offline-bar" style="display:none; background:#A0525C; color:#fff; text-align:center; padding:7px; font-weight:800; font-size:13px;">오프라인 — 스캔은 계속 가능, 인터넷 연결 후 [전송하기] 하세요</div>

    <div class="loc-submode" id="loc-submode">
        <button data-sub="today" class="active">당일 입고분</button>
        <button data-sub="existing">기존재고</button>
    </div>
    <div class="loc-banner" id="loc-banner">위치를 먼저 스캔하세요</div>

    <!-- [Ver 8.1] 수동입력 토글 버튼 (위치모드) -->
    <div id="loc-manual-row" style="display:none; padding:6px 10px 0; background:var(--c-bg);">
        <button id="btn-manual-toggle" style="width:100%; padding:9px; border:1px dashed var(--c-line-strong); background:var(--c-surface); color:var(--c-text-2); border-radius:var(--r-sm); font-weight:800; cursor:pointer;">수동입력</button>
    </div>

    <!-- [Ver 8.0] 위치모드 수동 입력 (스캔이 안 될 때) -->
    <div id="loc-manual" style="display:none; flex-direction:column; gap:6px; padding:8px 10px; background:var(--c-bg);">
        <div style="display:flex; gap:6px;">
            <input id="manual-loc" placeholder="위치 입력 (A1R→A-1-R, 155→비축-155)" autocapitalize="characters" style="flex:1; min-width:0; padding:9px; border:1px solid var(--c-line-strong); border-radius:var(--r-sm); font-size:14px;">
            <button id="btn-manual-loc" style="padding:8px 13px; border:1px solid var(--c-line-strong); background:var(--c-surface); color:var(--c-text); border-radius:var(--r-sm); font-weight:800; white-space:nowrap;">위치설정</button>
        </div>
        <div style="display:flex; gap:6px;">
            <input id="manual-code" placeholder="상품코드 입력 (S 생략 가능: 123456)" inputmode="numeric" pattern="[0-9]*" autocapitalize="characters" style="flex:1; min-width:0; padding:9px; border:1px solid var(--c-line-strong); border-radius:var(--r-sm); font-size:14px;">
            <button id="btn-manual-code" style="padding:9px 14px; border:none; background:#3D756F; color:#fff; border-radius:var(--r-sm); font-weight:800; white-space:nowrap;">추가</button>
        </div>
    </div>

    <!-- [Ver 8.71] 입고모드 수동입력 토글 (바코드 스캔이 안 될 때) -->
    <div id="in-manual-row" style="display:none; padding:6px 10px 0; background:var(--c-bg);">
        <button id="btn-in-manual-toggle" style="width:100%; padding:9px; border:1px dashed var(--c-line-strong); background:var(--c-surface); color:var(--c-text-2); border-radius:var(--r-sm); font-weight:800; cursor:pointer;">수동입력</button>
    </div>
    <div id="in-manual" style="display:none; padding:8px 10px; background:var(--c-bg);">
        <div style="display:flex; gap:6px;">
            <input id="in-manual-code" placeholder="상품코드/바코드 (S 생략 가능: 123456)" inputmode="numeric" pattern="[0-9]*" autocapitalize="characters" autocomplete="off" style="flex:1; min-width:0; padding:9px; border:1px solid var(--c-line-strong); border-radius:var(--r-sm); font-size:14px;">
            <button id="btn-in-manual-code" style="padding:9px 14px; border:none; background:var(--c-accent); color:#fff; border-radius:var(--r-sm); font-weight:800; white-space:nowrap;">확인</button>
        </div>
    </div>

    <div class="scan-wrap">
        <div id="reader"></div>
        <button class="btn-start" id="btn-start">스캔 시작</button>
        <div class="cam-controls" id="cam-controls">
            <button id="btn-torch" aria-label="손전등"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block; margin:4px;"><path d="M18 6c0 2-2 2-2 4v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V10c0-2-2-2-2-4V2h12z"/><line x1="6" y1="6" x2="18" y2="6"/><line x1="12" y1="12" x2="12" y2="12"/></svg></button>
            <button id="btn-zoom-out" aria-label="축소"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block; margin:4px;"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            <span id="zoom-label">1.0x</span>
            <button id="btn-zoom-in" aria-label="확대"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block; margin:4px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <button class="btn-capture" id="btn-capture" title="수동 촬영 인식"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <div class="queue" id="queue"></div>
    </div>
    <div id="file-reader" style="display:none;"></div>

    <div class="send-bar"><button class="btn-send" id="btn-send" disabled>전송하기 (0)</button></div>

    <!-- 설정 모달 -->
    <div class="overlay" id="ov-set"><div class="modal">

        <div class="set-desc">켜면 스캔하자마자 수량 팝업이 숫자 키패드 상태로 열려 바로 입력할 수 있습니다. 끄면 빠른 선택(십·일 자리) 화면으로 열립니다.</div>

    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="js/location-map.js?v=202610281554"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, writeBatch, increment, serverTimestamp, onSnapshot, runTransaction, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { firebaseConfig } from './js/china-stock-config.js?v=202610281554'; // china-stock 전용 설정(work-tool-e2943)
        import { setShellContext } from './js/app-shell-bridge.js?v=202610281554';   // 공통 상단바(uid 만 — 메뉴는 캐시)
        import { checkProductCode } from './js/lib/product-code.js?v=202610281554';  // 위치지정 상품코드 'S+숫자6자리' 판정
        import { availOf, planTake, staleHoldIds, floor2Step, isSplitItem, newHoldId, pendingExpired, HOLD_PENDING_MAX_MS } from './js/lib/scan-hold.js?v=202610281554'; // [Ver 10.7] 미발 동시 스캔 방지
        import { connectEmulatorsIfEnabled } from './js/firebase-emulator.js?v=202610281554'; // 🧪 localhost + ?emu=1 일 때만 에뮬레이터(운영에서는 아무 일 안 함)

        const SCAN_VERSION = '10.7'; // 웹 배포 버전과 함께 올림 (china-stock-version.json의 web)

        // ---------------- 서버 선택 (URL 파라미터 → 저장값 → 기본 config) ----------------
        const params = new URLSearchParams(location.search);
        let serverCfg = null;
        try { serverCfg = JSON.parse(localStorage.getItem('scanServerCfg') || 'null'); } catch (e) {}
        // [2026-09-04] china-stock 프로젝트 통합 — 폰에 저장돼 있던 옛 서버(location-*) 설정은 버린다.
        //   그대로 두면 스캔 결과가 더 이상 쓰지 않는 프로젝트로 들어간다.
        const RETIRED_PROJECTS = ['location-e2ff9', 'location-data-c374f'];
        if (serverCfg && RETIRED_PROJECTS.includes(serverCfg.projectId)) {
            localStorage.removeItem('scanServerCfg');
            serverCfg = null;
        }
        if (params.get('projectId') && params.get('apiKey')) {
            serverCfg = {
                label: params.get('label') || params.get('projectId'),
                projectId: params.get('projectId'), apiKey: params.get('apiKey'),
                appId: params.get('appId') || '', messagingSenderId: params.get('messagingSenderId') || ''
            };
            localStorage.setItem('scanServerCfg', JSON.stringify(serverCfg));
            history.replaceState(null, '', location.pathname);
        }
        const activeCfg = serverCfg
            ? { apiKey: serverCfg.apiKey, projectId: serverCfg.projectId, appId: serverCfg.appId || undefined, messagingSenderId: serverCfg.messagingSenderId || undefined }
            : firebaseConfig;
        const serverLabel = serverCfg ? (serverCfg.label || serverCfg.projectId) : (firebaseConfig.projectId + ' (기본)');
        const app = initializeApp(activeCfg, 'scanApp');
        const db = getFirestore(app);
        // 🧪 기본 서버일 때만, 첫 읽기·쓰기보다 먼저. 운영(GitHub Pages)에서는 hostname 검사에 걸려 아무 일도 하지 않는다.
        if (!serverCfg) connectEmulatorsIfEnabled(db, getAuth(app));

        // ── 🔒 로그인 확인 ─────────────────────────────────────────────
        // 기본 서버(메인 프로젝트)를 쓸 때만 확인한다. QR/URL로 다른 서버를 지정한 경우는
        // 그 서버의 규칙을 따르므로 여기서 막지 않는다.
        // 폰에서도 메인 앱(업무관리)에 한 번 로그인해 두면 그 뒤로는 그대로 열린다.
        if (!serverCfg) {
            const gate = document.createElement('div');
            gate.style.cssText = `position:fixed; inset:var(--as-h,0px) 0 0 0; z-index:2147483600; background:var(--c-bg,#F5F6F8); color:var(--c-text,#23272E);
                display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
                font-family:'SUIT','Noto Sans KR',sans-serif; text-align:center; padding:24px;`;
            gate.innerHTML = `<div style="font-size:42px; color:var(--c-text-3,#69707A);"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
                <div style="font-size:17px; font-weight:800;">로그인 확인 중…</div>`;
            document.body.appendChild(gate);
            const auth = getAuth(app);
            onAuthStateChanged(auth, (user) => {
                setShellContext(user ? { signedIn: true, uid: user.uid } : { signedIn: false });
                if (user) { gate.remove(); resolvePendingHolds().finally(() => retryReleases()); return; } // [Ver 10.7] 로그인 뒤 미발 확인·해제 정리
                // 업무관리에 로그인해 두었어도 세션이 공유되지 않는 경우가 있다
                // (홈 화면 앱에서 다른 브라우저로 열리거나, 사생활 보호 모드 등).
                // 그래서 여기서 바로 로그인할 수 있게 한다 — 계정은 업무관리와 같다.
                gate.innerHTML = `<div style="font-size:40px; color:var(--c-text-3,#69707A);"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
                    <div style="font-size:17px; font-weight:800;">로그인이 필요합니다</div>
                    <div style="font-size:12.5px; color:var(--c-text-2,#646B75); line-height:1.7; max-width:320px;">
                        업무관리와 같은 계정입니다.<br>이 폰에서 한 번 로그인하면 다음부터는 바로 열립니다.</div>
                    <form id="sc-login" style="display:flex; flex-direction:column; gap:8px; width:100%; max-width:300px; margin-top:4px;">
                        <input id="sc-email" type="email" inputmode="email" autocomplete="username" placeholder="이메일"
                               style="padding:12px; border:1px solid var(--c-line-strong,#D6DAE0); border-radius:10px; font-size:16px; background:var(--c-surface,#fff); color:var(--c-text,#23272E);">
                        <input id="sc-pw" type="password" autocomplete="current-password" placeholder="비밀번호"
                               style="padding:12px; border:1px solid var(--c-line-strong,#D6DAE0); border-radius:10px; font-size:16px; background:var(--c-surface,#fff); color:var(--c-text,#23272E);">
                        <button type="submit" id="sc-login-btn"
                                style="padding:13px; border:0; border-radius:999px; background:#2F62C9; color:#fff; font-size:16px; font-weight:700;">로그인</button>
                        <div id="sc-login-err" style="font-size:12px; color:var(--c-risk-text,#A0525C); min-height:16px;"></div>
                    </form>`;
                gate.querySelector('#sc-login').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    const btn = gate.querySelector('#sc-login-btn');
                    const err = gate.querySelector('#sc-login-err');
                    btn.disabled = true; btn.textContent = '로그인 중…'; err.textContent = '';
                    try {
                        await signInWithEmailAndPassword(auth,
                            gate.querySelector('#sc-email').value.trim(),
                            gate.querySelector('#sc-pw').value);
                    } catch (e2) {
                        const code = (e2 && e2.code) || '';
                        err.textContent = (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found')
                            ? '이메일 또는 비밀번호가 잘못되었습니다.' : ('로그인 오류: ' + (code || e2));
                        btn.disabled = false; btn.textContent = '로그인';
                    }
                });
            });
        }

        // 큰 맵은 문서에 JSON 문자열(mapStr)로 저장된다 — 옛 형식(map)도 함께 지원
        function unpackMap(data) {
            if (!data) return {};
            if (typeof data.mapStr === 'string') {
                try { return JSON.parse(data.mapStr) || {}; } catch (e) { return {}; }
            }
            return data.map || {};
        }

        // [Ver 5.8] 위치 매핑을 Firebase(LOCATION_MAP)에서 로드 - 하드코딩 대신 (없으면 location-map.js 기본값)
        let locMapOverride = null;
        async function loadLocationMap() {
            try {
                const snap = await getDoc(doc(db, 'ChinaStockGoods', 'LOCATION_MAP'));
                const m = snap.exists() ? unpackMap(snap.data()) : {};
                if (Object.keys(m).length) locMapOverride = m;
            } catch (e) {}
        }
        function getLoc(key) { return locMapOverride ? locMapOverride[key] : (typeof barcodeMap !== 'undefined' ? barcodeMap[key] : undefined); }

        // [Ver 8.3] 바코드 ≠ 상품코드 대응: 미발재고로그의 바코드→상품코드 맵을 로드해 변환
        let barcodeToCode = {};
        let barcodeMemo = {}; // [Ver 8.83] 오류바코드 사유 (바코드 → 사유 텍스트)
        let barcodeMapReady = false; // [Ver 8.85] 로딩 완료 여부
        async function loadBarcodeMap(retry = 0) {
            try {
                // [Ver 8.32] 자동맵(미발로그) + 수동 오류바코드매칭(BARCODE_ALIAS) 병합 (수동 우선)
                const [snap, aSnap] = await Promise.all([
                    getDoc(doc(db, 'ChinaStockGoods', 'BARCODE_MAP')),
                    getDoc(doc(db, 'ChinaStockGoods', 'BARCODE_ALIAS'))
                ]);
                const auto = snap.exists() ? unpackMap(snap.data()) : {};
                const alias = aSnap.exists() ? unpackMap(aSnap.data()) : {};
                barcodeToCode = {}; barcodeMemo = {};
                for (const b in auto) barcodeToCode[b] = auto[b]; // 자동맵은 문자열
                for (const b in alias) { // [Ver 8.83] 수동맵: 문자열(구버전) 또는 {code, memo}
                    const v = alias[b];
                    const code = (v && typeof v === 'object') ? (v.code || '') : (v || '');
                    if (code) barcodeToCode[b] = code;
                    const memo = (v && typeof v === 'object') ? (v.memo || '') : '';
                    if (memo) barcodeMemo[b] = memo;
                }
                barcodeMapReady = true; // [Ver 8.85] 로딩 성공
            } catch (e) {
                // [Ver 8.85] 오류바코드 목록이 커서 로딩 실패/지연될 수 있음 → 재시도 (자가복구)
                if (retry < 6) setTimeout(() => loadBarcodeMap(retry + 1), 1500 * (retry + 1));
            }
        }
        // [Ver 8.88] 오류 사유를 별도 작은 문서(BARCODE_MEMO)에서 로드 — 큰 오류바코드 목록(315KB, 폰에서 중첩객체 파싱 실패) 의존 제거
        let memoReady = false;
        async function loadBarcodeMemo(retry = 0) {
            try {
                const s = await getDoc(doc(db, 'ChinaStockGoods', 'BARCODE_MEMO'));
                const m = s.exists() ? unpackMap(s.data()) : {};
                for (const b in m) { if (m[b]) barcodeMemo[b] = m[b]; } // 작은 문서로 사유 보강(확실히 로드)
                memoReady = true;
            } catch (e) { if (retry < 6) setTimeout(() => loadBarcodeMemo(retry + 1), 1500 * (retry + 1)); }
        }
        function resolveCode(scanned) {
            const k = (scanned || '').toString().trim().toUpperCase();
            return barcodeToCode[k] || k; // 바코드로 등록된 값이면 상품코드로, 아니면 그대로
        }
        function aliasMemo(scanned) { return barcodeMemo[(scanned || '').toString().trim().toUpperCase()] || ''; } // [Ver 8.83] 스캔한 바코드의 오류 사유
        // [Ver 8.15] 위치 데이터 샤드 (웹과 동일한 해시여야 함)
        const NUM_LOC_SHARDS = 8;
        function locShardId(code) { let h = 0; const s = String(code || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return 'LOC_SHARD_' + (h % NUM_LOC_SHARDS); }

        // ---------------- 상태 ----------------
        let mode = localStorage.getItem('scanMode') || 'in';
        // [Ver 4.1] 'today'(당일입고분) | 'existing'(기존재고)
        // (2026-10-16) 열 때마다 '당일 입고분'으로 시작한다 — 전에 고른 '기존재고'가 남아 당일 입고분이 기존재고로 들어가던 실수 방지
        let locSubMode = 'today';
        let inboundQueue = JSON.parse(localStorage.getItem('scanInQueue') || '[]');
        let locationQueue = JSON.parse(localStorage.getItem('scanLocQueue') || '[]');
        let fixedLocation = null;
        let directQty = localStorage.getItem('scanDirectQty') === '1';
        let scanner = null, scanning = false, processing = false, sending = false;

        const $ = (id) => document.getElementById(id);
        const saveQueues = () => { localStorage.setItem('scanInQueue', JSON.stringify(inboundQueue)); localStorage.setItem('scanLocQueue', JSON.stringify(locationQueue)); };

        function speak(t) { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 1.1; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
        function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

        // ---------------- 스캐너 ----------------
        async function startScan() {
            if (scanning) return;
            try {
                const formats = [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_13];
                scanner = new Html5Qrcode('reader', {
                    formatsToSupport: formats,
                    verbose: false,
                    // [Ver 3.5] 지원 기기(안드로이드 크롬 등)에서 하드웨어 가속 바코드 감지기 사용 → 네이티브급 인식
                    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                });
                await scanner.start(
                    { facingMode: 'environment' },
                    {
                        fps: 15,
                        // [Ver 3.8] qrbox 제거 → 카메라 화면 전체가 인식 영역 (구역 조준 불필요)
                        disableFlip: true, // 후면 카메라라 반전 스캔 불필요 (속도 향상)
                        // [Ver 3.5] 고해상도 요청 (작은 바코드 인식률 향상)
                        videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                    },
                    onScan, () => {});
                scanning = true;
                $('btn-start').style.display = 'none';
                $('btn-capture').style.display = 'block'; // [Ver 3.9] 수동 촬영 버튼
                speak(''); // iOS 음성 잠금 해제
                setupCamControls(); // [Ver 3.5] 초점/손전등/줌
            } catch (e) { showAlert('카메라를 시작할 수 없습니다.\n(카메라 권한을 허용해주세요)\n' + e); }
        }

        // [Ver 3.5] 카메라 제어: 연속 자동초점 + 손전등/줌 버튼 (지원 기기에서만 표시)
        let camTrack = null, torchOn = false, hasTorch = false, zoomCaps = null, zoomLevel = 1;
        async function setupCamControls() {
            try {
                const video = document.querySelector('#reader video');
                camTrack = (video && video.srcObject) ? video.srcObject.getVideoTracks()[0] : null;
                if (!camTrack || !camTrack.getCapabilities) return;
                const caps = camTrack.getCapabilities();
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    try { await camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
                }
                hasTorch = !!caps.torch;
                zoomCaps = caps.zoom || null;
                if (zoomCaps) zoomLevel = Math.max(1, zoomCaps.min || 1);
                $('btn-torch').style.display = hasTorch ? '' : 'none';
                $('btn-zoom-out').style.display = $('btn-zoom-in').style.display = $('zoom-label').style.display = zoomCaps ? '' : 'none';
                if (hasTorch || zoomCaps) $('cam-controls').style.display = 'flex';
            } catch (e) {}
        }
        async function applyCam() {
            if (!camTrack) return;
            const adv = [];
            if (zoomCaps) adv.push({ zoom: zoomLevel });
            if (hasTorch) adv.push({ torch: torchOn });
            if (adv.length) { try { await camTrack.applyConstraints({ advanced: adv }); } catch (e) {} }
        }

        // [Ver 3.9] 탭-투-포커스: 화면을 탭한 지점에 초점을 강제로 맞춤 (연속 스캔 유지)
        function showFocusRing(clientX, clientY) {
            const r = document.createElement('div');
            r.className = 'focus-ring';
            r.style.left = clientX + 'px'; r.style.top = clientY + 'px';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 750);
        }
        async function focusAt(nx, ny) {
            if (!camTrack || !camTrack.getCapabilities) return;
            try {
                const caps = camTrack.getCapabilities();
                const adv = {};
                if ('pointsOfInterest' in caps) adv.pointsOfInterest = [{ x: nx, y: ny }];
                if (caps.focusMode && caps.focusMode.includes('single-shot')) adv.focusMode = 'single-shot';
                else if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
                if (Object.keys(adv).length) {
                    await camTrack.applyConstraints({ advanced: [adv] });
                    // 잠시 후 연속 초점 복귀 (single-shot로 고정된 초점 풀기)
                    if (adv.focusMode === 'single-shot' && caps.focusMode.includes('continuous')) {
                        setTimeout(() => { try { camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {} }, 2500);
                    }
                }
            } catch (e) {}
        }

        // [Ver 3.9] 수동 촬영 인식: 풀해상도 사진(지원 시) 또는 현재 프레임을 캡처해 디코딩
        let fileScanner = null;
        async function manualCapture() {
            if (!scanning || processing || !camTrack) return;
            toast('촬영 인식 중...');
            let file = null;
            // 1) 풀해상도 사진 (안드로이드 크롬 등 지원 기기)
            try {
                if (window.ImageCapture) {
                    const blob = await new ImageCapture(camTrack).takePhoto();
                    file = new File([blob], 'cap.jpg', { type: blob.type || 'image/jpeg' });
                }
            } catch (e) {}
            // 2) 폴백: 현재 비디오 프레임을 캔버스로 캡처 (아이폰 등)
            if (!file) {
                try {
                    const video = document.querySelector('#reader video');
                    const cv = document.createElement('canvas');
                    cv.width = video.videoWidth; cv.height = video.videoHeight;
                    cv.getContext('2d').drawImage(video, 0, 0);
                    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.95));
                    file = new File([blob], 'cap.jpg', { type: 'image/jpeg' });
                } catch (e) {}
            }
            if (!file) { toast('촬영 실패 (다시 시도)'); return; }
            try {
                if (!fileScanner) fileScanner = new Html5Qrcode('file-reader', { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
                const result = await fileScanner.scanFileV2(file, false);
                if (result && result.decodedText) { lastInputManual = false; onScan(result.decodedText); }
                else toast('바코드를 못 찾았어요 (다시 시도)');
            } catch (e) { toast('바코드를 못 찾았어요 (다시 시도)'); }
        }
        function pauseScan() { try { scanner.pause(true); } catch (e) {} }
        function resumeScan(delay = 700) { setTimeout(() => { try { scanner.resume(); } catch (e) {} processing = false; flushLateWarn(); }, delay); }

        // [Ver 9.7] 폰 뒤로가기 버튼: 스캔 팝업(수량/알림)이 열려 있으면 페이지 이탈 대신 팝업만 닫기
        let scanModalPushed = false;
        function pushScanModal() { if (!scanModalPushed) { scanModalPushed = true; try { history.pushState({ scanModal: 1 }, ''); } catch (e) {} } }
        function popScanModal() { if (scanModalPushed) { scanModalPushed = false; try { history.back(); } catch (e) {} } }
        window.addEventListener('popstate', () => {
            if (!scanModalPushed) return; // 우리가 넣은 상태가 아니면 관여하지 않음
            scanModalPushed = false;
            let closed = false;
            const sel = $('ov-select'); if (sel && sel.style.display !== 'none') { sel.style.display = 'none'; closed = true; }
            const al = $('ov-alert'); if (al && al.style.display !== 'none') { al.style.display = 'none'; alertForceAction = null; closed = true; }
            if (closed) resumeScan(); // 팝업만 닫고 스캔 재개 (첫 화면으로 안 나감)
        });

        async function onScan(text) {
            if (processing) return;
            processing = true; pauseScan();
            const raw = text.trim();

            // 서버 연결 QR (웹 [서버 연결 QR 출력]과 동일 형식)
            if (raw.startsWith('{') && raw.includes('fb-server')) {
                try { const c = JSON.parse(raw);
                    if (c && c.type === 'fb-server') {
                        localStorage.setItem('scanServerCfg', JSON.stringify(c));
                        speak('서버 연결됨');
                        alert('서버 연결: ' + (c.label || c.projectId) + '\n페이지를 다시 불러옵니다.');
                        location.reload(); return;
                    }
                } catch (e) {}
            }
            if (mode === 'in') await processInbound(raw); else processLocation(raw);
        }

        // [Ver 8.50] 강제전송 허용 상품코드 — 한 사용자가 강제전송하면 FORCE_ALLOW 문서에 기록 → 다른 사용자 스캔 시 미지정 오류 스킵 (실시간 공유)
        // (2026-10-22) 허용은 기한제 — map[code] = { at:'YYYY-MM-DD', until:'YYYY-MM-DD' }(기기 날짜, KST 기준).
        //   등록일 포함 FORCE_ALLOW_DAYS 일 동안만 통과. 옛 값(true)·기한 지난 값은 만료로 보고 다시 오류를 띄운다.
        //   기간을 바꾸려면 이 상수만 고친다.
        const FORCE_ALLOW_DAYS = 7;
        const forceAllowMap = new Map(); // code -> until('YYYY-MM-DD') — 자정을 넘겨 켜 둔 화면도 쓸 때마다 기한을 다시 본다
        const isForceAllowed = (code) => { const u = forceAllowMap.get(code); return typeof u === 'string' && u >= ymdLocal(new Date()); };
        function ymdLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function forceAllowValid(v, today) { return !!(v && typeof v === 'object' && typeof v.until === 'string' && v.until >= today); }
        function subscribeForceAllow() {
            try {
                onSnapshot(doc(db, 'ChinaStockGoods', 'FORCE_ALLOW'), (snap) => {
                    forceAllowMap.clear();
                    const m = (snap.exists() && snap.data().map) ? snap.data().map : {};
                    const today = ymdLocal(new Date());
                    Object.keys(m).forEach(c => { if (forceAllowValid(m[c], today)) forceAllowMap.set(c, m[c].until); });
                }, () => {});
            } catch (e) {}
        }
        async function registerForceAllow(code) {
            const now = new Date();
            const until = new Date(now.getFullYear(), now.getMonth(), now.getDate() + FORCE_ALLOW_DAYS - 1);
            const entry = { at: ymdLocal(now), until: ymdLocal(until) };
            forceAllowMap.set(code, entry.until); // 로컬 즉시 반영
            try { await setDoc(doc(db, 'ChinaStockGoods', 'FORCE_ALLOW'), { map: { [code]: entry }, updatedAt: serverTimestamp() }, { merge: true }); } catch (e) { toast('강제전송 허용을 공유하지 못했습니다(이 기기에서만 적용)'); }
        }

        // ---------------- 입고 모드 ----------------
        async function processInbound(code) {
            if (!barcodeMapReady) { await loadBarcodeMap(); } // [Ver 8.85] 오류바코드 맵 미로딩 시 먼저 로드 → 변환 누락 방지
            if (!memoReady) { await loadBarcodeMemo(); } // [Ver 8.88] 사유(작은 문서) 확실히 로드
            let key = resolveCode(code); // [Ver 8.3] 바코드 → 상품코드 변환

            // 🔎 상품코드 확정 — 스캔한 값을 '있는 그대로' 먼저 찾는다.
            //    숫자만 입력한 경우에만, 그것도 못 찾았을 때만 'S'를 붙여 한 번 더 찾는다.
            //    (예전에는 숫자면 무조건 S를 붙여, 숫자 바코드를 쓰는 P코드 상품 등을 못 찾았다)
            let snap = null, dbError = false;
            // [Ver 10.7] 다른 기기가 '잡아 둔' 미발(hold/now)도 같이 읽는다 — 못 읽으면 ScanDB 값 그대로 + 작은 표시
            let holdData = null, holdOk = false;
            const readHold = (k) => getDoc(holdRef(k)).then(h => { holdData = h.exists() ? h.data() : null; holdOk = true; }, () => { holdData = null; holdOk = false; });
            try {
                let hp = readHold(key);
                snap = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', key));
                if (!snap.exists() && /^[0-9]+$/.test(key)) {
                    const alt = 'S' + key;
                    const s2 = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', alt));
                    if (s2.exists()) { key = alt; snap = s2; hp = hp.then(() => readHold(alt)); }
                    // 둘 다 없을 때: 'S+6자리'(예: 550076) 모양일 때만 S 를 붙여 안내한다.
                    // 546881055 처럼 숫자 자체가 상품코드인 경우도 있어, 함부로 바꾸면 엉뚱한 코드로 등록된다.
                    else if (/^[0-9]{6}$/.test(key)) { key = alt; snap = s2; }
                }
                await hp;
            } catch (e) { dbError = true; }

            const memoText = aliasMemo(code) || aliasMemo(key); // [Ver 8.89] 원래 스캔값 또는 최종코드로 사유 조회
            // [Ver 8.48] 음수 방지(입고 초과분) / d 없을 때(미등록·DB오류 강제전송)는 빈 값으로 진행
            // [Ver 10.7] mibalQty = 보여 줄 남은 미발(ScanDB − 다른 스캔이 잡아 둔 몫), mibalRaw = ScanDB 값(옛 비축 배분 식의 기준)
            const buildItem = (d) => {
                const raw = Math.max(parseInt(d && d.mibalQty) || 0, 0);
                const shown = (d && holdOk) ? availOf(d.mibalQty, holdData, Date.now()) : raw;
                return { code: key, name: (d && d.name) || '', location: (d && d.location) || '미지정', arrivalQty: Math.max(parseInt(d && d.arrivalQty) || 0, 0),
                    mibalQty: shown, mibalRaw: raw, holdUnknown: !!d && !holdOk && raw > 0, noScanDb: !d, aliasMemo: memoText };
            };
            const proceedWith = (d) => showSelect(buildItem(d));
            // [Ver 8.51] 강제전송 → 정상 입고 진행. (2026-10-22) 허용목록 등록은 수량을 골라 입고가 확정될 때(addInbound)만 한다 — 팝업만 열고 닫으면 등록 안 됨
            const forceProceed = (d) => showSelect({ ...buildItem(d), forceAllow: true });
            const memoPfx = memoText ? ('오류바코드: ' + memoText + '\n\n') : ''; // [Ver 8.84] 경고에도 사유 표시
            if (memoText) { speak('오류 바코드 확인'); try { navigator.vibrate([120, 80, 120]); } catch (e) {} }

            if (dbError) { showAlert(memoPfx + 'DB 조회 오류\n(네트워크 확인)\n(' + key + ')', () => proceedWith(null)); return; } // [Ver 8.51] 모든 오류에 강제전송. (2026-10-22) 조회 실패는 일시 오류라 허용목록에 올리지 않는다
            if (!snap || !snap.exists()) {
                if (isForceAllowed(key)) { proceedWith(null); return; } // [Ver 8.51] 이미 강제전송 허용된 상품 → 오류 없이 진행
                showAlert(memoPfx + '등록되지 않은 상품입니다.\n(' + key + ')', () => forceProceed(null)); // [Ver 8.51] 미등록도 강제전송 가능
                return;
            }
            const d = snap.data();
            if ((!d.location || d.location === '미지정') && !isForceAllowed(key)) { // [Ver 8.49] 로케이션 미지정 오류 (단, [Ver 8.50] 강제전송 등록된 상품은 통과)
                showAlert(memoPfx + '로케이션 미지정 상품입니다.\n(' + key + ')\n위치를 먼저 지정한 뒤 입고해주세요.', () => forceProceed(d));
                return;
            }
            proceedWith(d);
        }

        let currentItem = null;
        function showSelect(item) {
            currentItem = item;
            $('sel-code').textContent = item.code;
            $('sel-loc').textContent = item.location;
            $('sel-remain').textContent = item.mibalQty;
            // [미발 N개] 원탭 입고 — 미발 1~999개일 때만. 버튼이 같은 숫자를 보여 주므로 '미발수량' 줄은 숨긴다
            const mibal = parseInt(item.mibalQty) || 0;
            const showMibal = mibal >= 1 && mibal <= QTY_MAX;
            $('sel-mibal').textContent = `미발 ${mibal}개 입고`;
            $('sel-mibal').style.display = showMibal ? 'block' : 'none';
            $('sel-remain-row').style.display = showMibal ? 'none' : 'block';
            $('sel-holdnote').style.display = item.holdUnknown ? 'block' : 'none'; // [Ver 10.7] 잡아 둔 몫을 못 읽음
            qtyTens = 0;
            padBuf = ''; padOver = false;
            $('num-display').textContent = '0';
            document.querySelectorAll('#qty-tens button').forEach(b => b.classList.remove('sel')); // 십의자리 선택 해제(기본=한 자리)
            setQtyView(directQty ? 'pad' : 'quick'); // 설정 '스캔 즉시 수량 입력' 이 켜져 있으면 키패드로 연다
            // [Ver 8.83] 오류바코드 사유 표시 (등록된 경우) — 작업자가 처리 판단 (음성/진동은 processInbound에서 처리)
            const memoEl = $('sel-memo');
            if (memoEl) { if (item.aliasMemo) { memoEl.textContent = '오류바코드: ' + item.aliasMemo; memoEl.style.display = 'block'; } else memoEl.style.display = 'none'; }
            if (!item.aliasMemo && (parseInt(item.mibalQty) || 0) > 0) speak('미발'); // [Ver 8.79] 미발수량 있을 때만 '미발' 음성 (사유 있으면 사유 음성 우선)
            $('ov-select').style.display = 'flex';
            pushScanModal(); // [Ver 9.7] 뒤로가기로 팝업만 닫히게
            if (qtyView === 'pad') focusPad();
        }
        function closeSelect() { $('ov-select').style.display = 'none'; popScanModal(); }
        const selectOpen = () => $('ov-select').style.display === 'flex';

        // 수량 확정 — 빠른 선택·키패드·[미발 N개] 가 모두 여기로. 1~QTY_MAX 정수만 받는다(0·빈값은 확정 안 함)
        const QTY_MAX = 999;
        // [Ver 10.7] 확정 순간 서버에서 미발 몫을 먼저 잡는다(takeHold). 결과 또는 HOLD_WAIT_MS 까지 스캔을 멈춘 채 기다린다.
        //   중간에 무슨 오류가 나도(기기 저장 공간 부족 등) 스캔은 반드시 다시 켠다 — 경고창을 띄운 경우만 그 [확인]이 켠다.
        async function confirmQty(qty) {
            if (!selectOpen() || !currentItem) return; // 두 번 눌림(팝업이 이미 닫힘) 방지
            if (!Number.isInteger(qty) || qty < 1 || qty > QTY_MAX) return;
            const item = currentItem;
            closeSelect();
            let alerted = false;
            const saveFailMsg = '목록을 이 기기에 저장하지 못했습니다(저장 공간 부족 등).\n새로고침하면 사라질 수 있으니 지금 [전송하기]로 보내 주세요.\n(' + item.code + ' · ' + qty + '개)';
            try {
                const entry = addInbound(item, qty, '직접입력');
                // 트랜잭션보다 먼저 저장 — 그 사이 새로고침돼도 시작 정리(resolvePendingHolds)가 맞춘다.
                //   저장에 실패해도 항목은 목록(메모리)에 있어 미발 확인·전송은 그대로 한다.
                const saved = persist();
                const p = startHold(entry, item);
                if (p) {
                    const done = await Promise.race([p.then(() => true, () => true), sleep(HOLD_WAIT_MS).then(() => false)]);
                    const msg = freshWarns.get(entry.id); freshWarns.delete(entry.id);
                    if (msg) { showAlert(saved ? msg : msg + '\n\n' + saveFailMsg); alerted = true; return; } // [확인] → 스캔 재개
                    if (!done) lateIds.add(entry.id); // 늦게 오면 holdDone 이 갱신·경고
                }
                if (!saved) { showAlert(saveFailMsg); alerted = true; return; }
                speak(qty + '개');
            } catch (e) {
                console.warn('[scan] 수량 확정 처리 오류', e);
                try { showAlert('입고 목록 처리 중 오류 — 목록을 확인해 주세요.\n(' + item.code + ' · ' + qty + '개)'); alerted = true; } catch (e2) {}
            } finally {
                if (!alerted) { resumeScan(); refocusManual(); }
            }
        }

        function addInbound(item, qty, dest) {
            if (item.forceAllow) registerForceAllow(item.code); // 강제전송 건은 입고 확정 때만 허용목록에 올린다
            // [Ver 10.7] id·mibalShown·mibalTaken·hold 추가. mibalQty 는 예전 뜻(ScanDB 미발) 그대로 — 옛 비축 배분 식의 기준
            const entry = { id: newHoldId(), barcode: item.code, qty, name: item.name, location: item.location, dest,
                mibalQty: (item.mibalRaw !== undefined ? item.mibalRaw : item.mibalQty) || 0, mibalShown: parseInt(item.mibalQty) || 0,
                hold: 'pending', holdStart: Date.now(), time: new Date().toTimeString().slice(0, 8) };
            inboundQueue.unshift(entry);   // 저장(persist)은 부르는 쪽(confirmQty)이 한다
            return entry;
        }

        // ---------------- [Ver 10.7] 미발 '잡아 둠'(hold) ----------------
        // ChinaStockGoods_ScanDB/{code}/hold/now = { h: { [항목ID]: { q, at } } } — 설명은 js/lib/scan-hold.js
        // 확정 뒤 미발 확인(트랜잭션)을 기다리는 최대 시간. 운영 영향: 평소엔 0.5초 안에 끝나 체감이 거의 없다.
        //   망이 느리면 확정 한 건마다 스캔이 최대 2.5초 멈춘다(그동안 다음 바코드를 못 찍음). 넘기면 기다리지 않고 스캔을 켜고,
        //   결과가 늦게 오면 경고만 다음 스캔 사이에 띄운다. 늘리면 경고를 놓칠 일이 줄지만 느린 망에서 작업이 더 자주 끊긴다.
        const HOLD_WAIT_MS = 2500;
        const holdRef = (code) => doc(db, 'ChinaStockGoods_ScanDB', code, 'hold', 'now');
        const holdPending = new Map();   // 항목ID → 진행 중인 트랜잭션 Promise
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        const findEntry = (id) => inboundQueue.find(it => it && it.id === id) || null;
        // 목록 저장·그리기 — 수량 확정·미발 확인 쪽에서 부른다. 저장 공간 부족 등으로 실패해도 예외를 밖으로 던지지 않는다(스캔이 멈추지 않게).
        //   저장했으면 true.
        let persistWarned = false;
        function persist() {
            let ok = true;
            try { saveQueues(); persistWarned = false; }
            catch (e) { ok = false; console.warn('[scan] 목록 저장 실패', e); if (!persistWarned) { persistWarned = true; toast('기기에 목록 저장 실패 — 지금 [전송하기]로 보내 주세요'); } }
            try { renderQueue(); } catch (e) { console.warn('[scan] 목록 표시 실패', e); }
            return ok;
        }

        // 트랜잭션 한 번. ScanDB 가 없으면(웹 동기화로 지웠다 다시 쓰는 중) 1.5초 뒤 한 번 더, 그래도 없으면 none
        async function takeHold(code, id, shown, qty) {
            const sRef = doc(db, 'ChinaStockGoods_ScanDB', code), hRef = holdRef(code);
            for (let attempt = 0; attempt < 2; attempt++) {
                const r = await runTransaction(db, async (tx) => {
                    const s = await tx.get(sRef);
                    const h = await tx.get(hRef);
                    if (!s.exists()) return { missing: true };
                    const now = Date.now();
                    const hd = h.exists() ? h.data() : null;
                    const avail = availOf(s.data().mibalQty, hd, now);
                    const plan = planTake({ shown, avail, qty });
                    const upd = {};
                    staleHoldIds(hd, now).forEach(x => { upd[x] = deleteField(); }); // 만료된 남의 몫은 같이 지운다
                    if (plan.take > 0) upd[id] = { q: plan.take, at: now };
                    if (Object.keys(upd).length) tx.set(hRef, { h: upd }, { merge: true });
                    return { ...plan, avail };
                });
                if (!r.missing) return r;
                if (attempt === 0) await sleep(1500);
            }
            return { take: 0, warn: false, othersTook: 0, avail: 0, none: true };
        }

        // 조회 미발 0 / 오프라인이면 트랜잭션 없이 정한다(null 반환). 그 외 Promise(끝나면 항목 갱신, 거부하지 않음).
        //   ScanDB 자료 없이 들어온 건(미등록·조회 오류 강제전송)은 몫을 모르므로 mibalTaken 을 두지 않는다 → 옛 비축 배분 식
        //   HOLD_PENDING_MAX_MS(15초) 넘게 안 끝나면 '확인 불가'로 내려 전송할 수 있게 한다(expirePending).
        function startHold(entry, item) {
            try {
                if (!entry.mibalShown) { if (!(item && item.noScanDb)) entry.mibalTaken = 0; entry.hold = 'none'; persist(); return null; }
                if (!navigator.onLine) {
                    entry.hold = 'offline'; persist();
                    toast('오프라인 — 다른 작업자와 겹칠 수 있음');
                    return null;
                }
                const id = entry.id, code = entry.barcode, qty = entry.qty;
                const p = takeHold(code, id, entry.mibalShown, qty).then(
                    (r) => holdDone(id, r, null),
                    (e) => holdDone(id, null, e)
                ).finally(() => holdPending.delete(id));
                holdPending.set(id, p);
                setTimeout(() => expirePending(false), HOLD_PENDING_MAX_MS + 200);
                return p;
            } catch (e) {
                console.warn('[scan] 미발 확인 시작 오류', e);
                return null;   // 확인 중으로 남은 건은 전송 때 expirePending 이 '확인 불가'로 내린다
            }
        }

        // '확인 중'이 15초 넘은 항목 → '확인 불가'(hold 'offline', 옛 비축 배분 식). includeIdle = 새로고침 등으로 진행 중 트랜잭션이 없는 건도.
        //   진행 중이던 트랜잭션이 나중에 끝나면 결과를 쓰지 않고, 그때 써진 몫은 바로 푼다(holdDone → timedOut).
        const timedOut = new Map();   // 항목ID → 상품코드
        function expirePending(includeIdle) {
            const now = Date.now(); let n = 0;
            for (const it of inboundQueue) {
                if (!it || !it.id || !pendingExpired(it, now)) continue;
                const live = holdPending.has(it.id);
                if (!live && !includeIdle) continue;
                it.hold = 'offline'; it.holdWhy = 'timeout'; delete it.mibalTaken;
                if (live) timedOut.set(it.id, it.barcode);
                n++;
            }
            if (n) { persist(); toast(`미발 확인이 늦어 ${n}건은 확인 없이 보냅니다 — 다른 작업자와 겹칠 수 있음`); }
            return n;
        }

        function warnText(code, qty, r) {
            return `다른 작업자가 방금 ${r.othersTook}개를 피킹용으로 뺐습니다 — 남은 미발 ${r.avail}개\n(${code} · 이번 ${qty}개: 피킹 ${r.take} · 비축 ${qty - r.take})`;
        }
        function noticeText(code, qty, r) {
            return `${code}: 다른 작업자가 ${r.othersTook}개를 먼저 잡음 — 이번 ${qty}개는 모두 피킹`;
        }

        // 트랜잭션 결과를 큐 항목에 적는다. 같은 객체가 아니어도(새로고침·되돌리기) id 로 찾는다.
        // 이번 수량을 다 피킹으로 못 잡았을 때(warn)만 경고창 — HOLD_WAIT_MS 안에 왔으면 confirmQty 가, 늦게 왔으면 여기서(스캔 중이면 다음 재개 때) 띄운다.
        // 남이 일부 가져갔지만 다 잡았으면(notice) 토스트만. 예외는 밖으로 던지지 않는다.
        const lateWarns = [], lateIds = new Set(), freshWarns = new Map();
        function holdDone(id, r, err) {
            try {
                const late = lateIds.delete(id);
                if (timedOut.has(id)) {   // 15초 넘어 '확인 불가'로 내린 건 — 결과는 쓰지 않고, 늦게 써진 몫은 바로 푼다(고아 hold 방지)
                    const code = timedOut.get(id); timedOut.delete(id);
                    // 오류로 와도 실제로는 커밋됐을 수 있다(응답 유실) — 지울 값이 없으면 아무 일도 없으니 늘 푼다
                    if (err || (r && r.take > 0)) { markRelease(code, id, true); releaseHold(code, id, true); }
                    return;
                }
                const it = findEntry(id) || deletedEntries.get(id);
                if (!it) return;
                if (err || !r || r.none) {
                    // 서버 확인 실패 · ScanDB 문서 없음(웹 동기화 중 등) → 몫을 모름 → 옛 방식으로 전송
                    it.hold = 'offline'; it.holdWhy = r && r.none ? 'nodb' : 'error'; delete it.mibalTaken;
                    if (findEntry(id)) toast(`${it.barcode} 미발 확인 ${r && r.none ? '불가(상품 자료 없음)' : '실패'} — 다른 작업자와 겹칠 수 있음`);
                } else {
                    it.mibalTaken = r.take;
                    it.hold = r.take > 0 ? 'ok' : 'none';
                    if (r.warn) {
                        const msg = warnText(it.barcode, it.qty, r);
                        if (late) { if (findEntry(id)) showLateWarn(msg); }
                        else freshWarns.set(id, msg);
                    } else if (r.notice && findEntry(id)) toast(noticeText(it.barcode, it.qty, r));
                }
                if (findEntry(id)) persist();
            } catch (e) { console.warn('[scan] 미발 확인 결과 처리 오류', e); }
        }
        function showLateWarn(msg) {
            if (!processing) { processing = true; pauseScan(); showAlert(msg); }
            else lateWarns.push(msg);
        }
        function flushLateWarn() {
            if (processing || !lateWarns.length) return;
            processing = true; pauseScan(); showAlert(lateWarns.shift());
        }

        // 삭제 확정된 항목의 몫을 푼다. 실패하면 scanHoldRelease 에 남겨 시작·online 때 다시.
        const RELEASE_KEY = 'scanHoldRelease';
        const deletedEntries = new Map();   // 지웠지만 아직 트랜잭션이 끝나지 않았을 수 있는 항목
        function loadReleaseList() { try { const a = JSON.parse(localStorage.getItem(RELEASE_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
        function saveReleaseList(a) { if (a.length) localStorage.setItem(RELEASE_KEY, JSON.stringify(a)); else localStorage.removeItem(RELEASE_KEY); }
        // force = 큐에 그 항목이 있어도 푼다(15초 넘어 '확인 불가'로 내린 뒤 늦게 써진 몫)
        function markRelease(code, id, force) {
            try {
                const a = loadReleaseList(); const x = a.find(y => y && y.id === id);
                if (!x) a.push(force ? { code, id, force: true } : { code, id }); else if (force) x.force = true;
                saveReleaseList(a);
            } catch (e) { console.warn('[scan] 해제 목록 저장 실패', e); }
        }
        function unmarkRelease(id) { saveReleaseList(loadReleaseList().filter(x => x.id !== id)); }
        async function releaseHold(code, id, force) {
            const p = holdPending.get(id);
            if (p) { try { await p; } catch (e) {} }   // 진행 중이면 끝난 뒤에 푼다(늦게 써지는 몫이 남지 않게)
            deletedEntries.delete(id);
            if (!force && findEntry(id)) { unmarkRelease(id); return true; }   // 그새 되돌렸다
            try {
                await updateDoc(holdRef(code), { ['h.' + id]: deleteField() });
            } catch (e) {
                if (!(e && e.code === 'not-found')) return false;   // 문서 없음 = 풀 것 없음
            }
            unmarkRelease(id);
            return true;
        }
        let releasing = false;
        async function retryReleases() {
            if (releasing || !navigator.onLine) return;
            releasing = true;
            try {
                for (const x of loadReleaseList()) {
                    if (!x || !x.id || !x.code) { unmarkRelease(x && x.id); continue; }
                    if (!x.force && (findEntry(x.id) || deletedEntries.has(x.id))) continue;   // 큐에 있거나 되돌리기 대기 중
                    await releaseHold(x.code, x.id, !!x.force);
                }
            } finally { releasing = false; }
        }

        // 시작 정리: 트랜잭션 결과를 모른 채 남은 pending 항목 — hold 에 내 몫이 있으면 ok, 없으면 오프라인(옛 방식)
        async function resolvePendingHolds() {
            const pend = inboundQueue.filter(it => it && it.id && it.hold === 'pending' && !holdPending.has(it.id));
            if (!pend.length || !navigator.onLine) return;
            const codes = [...new Set(pend.map(it => it.barcode))];
            await Promise.all(codes.map(async (code) => {
                let hd;
                try { const s = await getDoc(holdRef(code)); hd = s.exists() ? (s.data() || {}) : {}; } catch (e) { return; } // 못 읽으면 다음 online 때
                pend.filter(it => it.barcode === code).forEach(it => {
                    const mine = hd.h && hd.h[it.id];
                    if (mine && (parseInt(mine.q) || 0) > 0) { it.hold = 'ok'; it.mibalTaken = parseInt(mine.q) || 0; }
                    else { it.hold = 'offline'; it.holdWhy = 'unknown'; delete it.mibalTaken; }
                });
            }));
            persist();
        }

        // [Ver 8.69] 스캔 팝업에 십/일 자리 선택 표시 (일의자리 누르면 자동 확정 → 큐 추가)
        let qtyTens = 0;
        function buildQtySelector() {
            const tens = $('qty-tens'), ones = $('qty-ones');
            // 십의 자리: 1, 2 만 (한 자리 수량은 일의자리만 누르면 됨). 같은 버튼 다시 누르면 해제.
            [1, 2].forEach(i => {
                const bt = document.createElement('button'); bt.textContent = i; bt.dataset.d = String(i);
                bt.onclick = () => {
                    const already = qtyTens === i;
                    qtyTens = already ? 0 : i;
                    document.querySelectorAll('#qty-tens button').forEach(x => x.classList.toggle('sel', !already && x === bt));
                    $('num-display').textContent = String(qtyTens * 10);
                };
                tens.appendChild(bt);
            });
            for (let i = 0; i <= 9; i++) {
                const bo = document.createElement('button'); bo.textContent = i; bo.dataset.d = String(i);
                bo.onclick = () => { const qty = qtyTens * 10 + i; $('num-display').textContent = String(qty); if (qty > 0) confirmQty(qty); };
                ones.appendChild(bo);
            }
            // 키패드: 1 2 3 / 4 5 6 / 7 8 9 / ← 0 확인
            const pad = $('numpad');
            ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'ok'].forEach(k => {
                const b = document.createElement('button'); b.type = 'button';
                if (k === 'back') { b.textContent = '←'; b.setAttribute('aria-label', '지우기'); b.onclick = () => padKey('Backspace'); }
                else if (k === 'ok') { b.textContent = '확인'; b.className = 'np-ok'; b.id = 'np-ok'; b.onclick = () => padKey('Enter'); }
                else { b.textContent = k; b.onclick = () => padKey(k); }
                pad.appendChild(b);
            });
            $('qty-to-pad').onclick = () => { padBuf = ''; padOver = false; $('num-display').textContent = '0'; setQtyView('pad'); focusPad(); };
            $('qty-to-quick').onclick = () => { qtyTens = 0; padBuf = ''; padOver = false; $('num-display').textContent = '0'; document.querySelectorAll('#qty-tens button').forEach(b => b.classList.remove('sel')); setQtyView('quick'); };
            $('sel-mibal').onclick = () => confirmQty(parseInt(currentItem && currentItem.mibalQty) || 0);
            // 키패드 화면일 때는 실제 키보드(블루투스 키보드·PC)의 숫자·지우기·엔터도 받는다
            document.addEventListener('keydown', (e) => {
                if (!selectOpen() || qtyView !== 'pad') return;
                if (/^[0-9]$/.test(e.key) || e.key === 'Backspace' || e.key === 'Enter') { e.preventDefault(); padKey(e.key); }
                // 숫자 아닌 글자(바코드 스캐너가 키패드에 영문+숫자를 찍는 경우)는 막는다 — ← 로 지울 때까지 확인 불가
                else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); padOver = true; renderPad(); }
            });
        }

        // 키패드 직접 입력 (1~999). padBuf = 입력 중인 숫자 문자열
        // padOver = 네 자리 이상을 넣으려 함 → ← 로 지울 때까지 확인 불가(바코드 건이 키패드에 숫자를 쳐도 앞 세 자리로 입고되지 않게)
        let qtyView = 'quick', padBuf = '', padOver = false;
        function setQtyView(v) {
            qtyView = v;
            $('qty-quick').style.display = v === 'quick' ? 'block' : 'none';
            $('qty-pad').style.display = v === 'pad' ? 'block' : 'none';
            if (v !== 'pad') { $('num-display').style.color = ''; $('num-display').style.fontSize = ''; }
            renderPad();
        }
        function focusPad() { try { $('num-display').focus({ preventScroll: true }); } catch (e) {} }
        function renderPad() {
            if (qtyView !== 'pad') return;
            const d = $('num-display');
            d.textContent = padOver ? `최대 ${QTY_MAX}개 — ← 로 지우세요` : (padBuf || '0');
            d.style.color = padOver ? 'var(--c-risk-text)' : '';
            d.style.fontSize = padOver ? '18px' : '';
            const n = parseInt(padBuf) || 0;
            $('np-ok').disabled = padOver || !(n >= 1 && n <= QTY_MAX);
        }
        function padKey(k) {
            if (k === 'Backspace') { if (padOver) { padOver = false; padBuf = ''; } else padBuf = padBuf.slice(0, -1); }
            else if (k === 'Enter') { if (!padOver) confirmQty(parseInt(padBuf) || 0); return; }
            else if (/^[0-9]$/.test(k)) {
                if (padOver) return;
                if (!padBuf && k === '0') return;                   // 앞자리 0 은 받지 않는다
                if (padBuf.length >= String(QTY_MAX).length) { padOver = true; try { navigator.vibrate(120); } catch (e) {} } // 세 자리(999)까지
                else padBuf += k;
            }
            renderPad();
        }

        // ---------------- 위치 모드 ----------------
        async function processLocation(code) {
            const raw = code.toUpperCase();
            const mapped = getLoc(raw);
            if (mapped) {
                fixedLocation = mapped;
                renderLocBanner(); speak('위치 변경'); resumeScan(); return;
            }
            if (!fixedLocation) { speak('위치를 먼저 찍으세요'); toast('위치 바코드를 먼저 스캔하세요'); resumeScan(); return; }
            const key = resolveCode(raw); // [Ver 8.3] 바코드 → 상품코드 변환
            // 2026-10-19 사용자 결정: S+6자리 외는 오류 + 강제추가 (아래 addLoc 정의 뒤에서 검사).
            // 영문·숫자 5자 미만 같은 깨진 값은 예전처럼 강제추가 없이 막는다.
            if (!/^[A-Z0-9]{5,}$/.test(key)) { showAlert('형식 오류\n(올바른 상품 바코드가 아닙니다)\n(' + key + ')'); return; }
            // [Ver 4.1→8.1] ScanDB 조회 (오프라인이면 생략 → 스캔은 허용)
            let name = '', exists = false, dbError = false;
            if (navigator.onLine) {
                try { const snap = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', key)); if (snap.exists()) { exists = true; name = snap.data().name || ''; } }
                catch (e) { dbError = true; }
            }
            // 당일 입고분 모드: 온라인일 때만 목록 검증(오스캔 차단), 오프라인이면 생략
            const addLoc = () => { // [Ver 8.56] 위치 큐 추가 (강제추가에서도 재사용)
                locationQueue.unshift({ barcode: key, location: fixedLocation, name, sub: locSubMode, time: new Date().toTimeString().slice(0, 8) });
                saveQueues(); renderQueue(); speak('스캔'); resumeScan();
            };
            // 2026-10-19 사용자 결정: S+6자리 외는 오류 + 강제추가 (등록 상품이어도). [확인] → resumeScan
            if (!checkProductCode(key).ok) { showAlert('상품코드 형식이 아닙니다 (S+숫자6자리): ' + key, () => addLoc(), '강제추가'); return; }
            if (locSubMode === 'today') {
                if (!navigator.onLine) { toast('오프라인 · 목록 확인 생략'); }
                else if (dbError) { showAlert('DB 조회 오류\n(네트워크 확인)\n(' + key + ')', () => addLoc(), '강제추가'); return; } // [Ver 8.56]
                else if (!exists) { showAlert('당일 입고 목록에 없는 상품입니다.\n(오스캔 여부 확인)\n' + key, () => addLoc(), '강제추가'); return; } // [Ver 8.56] 강제추가로 위치지정 가능
            }
            addLoc();
        }

        // [Ver 8.0] 위치 수동 입력 — 스캔이 안 될 때 위치/상품코드를 직접 입력
        // [Ver 8.71] 입고모드 수동입력: 스캔과 동일하게 onScan으로 넘김 → processInbound → 수량 선택 팝업
        // 수동입력 칸이 열려 있으면 다음 입력 칸으로 커서를 돌려놓는다(연속 입력용). 닫혀 있으면 아무것도 안 함
        // 직전 입력이 수동입력일 때만 — 카메라 스캔 뒤에 키보드가 뜨지 않게(lastInputManual 은 수동 제출에서 켜고 여기서 끈다)
        let lastInputManual = false;
        function refocusManual() {
            if (!lastInputManual) return;
            lastInputManual = false;
            if (mode === 'in') {
                if ($('in-manual').style.display === 'block') $('in-manual-code').focus();
            } else if (mode === 'loc') {
                if ($('loc-manual').style.display === 'flex') (fixedLocation ? $('manual-code') : $('manual-loc')).focus();
            }
        }
        function inManualSubmit() {
            const el = $('in-manual-code'); const v = (el.value || '').trim();
            if (!v) return;
            el.value = '';
            lastInputManual = true;
            onScan(v.toUpperCase());
        }
        // [Ver 8.73] 위치 직접입력을 위치매핑(LOCATION_MAP) 등록값 형식에 맞춰 정규화
        //  - 구분자 없이 입력해도 등록된 형식대로 조립 (예: A1R → A-1-R, 비축155 → 비축-155)
        //  - 숫자만이면 기본 예약존 '비축-' 부착
        function activeLocMap() { return locMapOverride || (typeof barcodeMap !== 'undefined' ? barcodeMap : {}); }
        function stripLoc(s) { return String(s || '').toUpperCase().replace(/[\s-]/g, ''); }
        // [Ver 8.82] 위치매핑 등록값에 맞춰 정규화 — 등록 안 된 위치면 null(오류). 단 등록데이터가 아직 없으면 잠금 방지용 폴백.
        function normalizeManualLoc(v) {
            v = (v || '').trim();
            if (!v) return null;
            const idx = {}, m = activeLocMap(); let count = 0;
            for (const k in m) { const val = m[k]; if (val) { const sk = stripLoc(val); if (sk && !(sk in idx)) { idx[sk] = val; count++; } } }
            const key = stripLoc(v);
            if (idx[key]) return idx[key];                        // 등록 형식에 매칭 (A1R → A-1-R, 비축155 → 비축-155)
            if (/^\d+$/.test(v) && idx['비축' + key]) return idx['비축' + key]; // 숫자만 → 등록된 비축
            if (count === 0) return /^\d+$/.test(v) ? ('비축-' + v) : v.toUpperCase(); // 등록데이터 없으면 검증 불가 → 폴백(잠금 방지)
            return null;                                          // 등록된 위치가 아님 → 오류
        }
        function manualSetLocation() {
            const el = $('manual-loc'); const raw = (el.value || '').trim();
            if (!raw) return;
            const v = normalizeManualLoc(raw);
            if (!v) { // [Ver 8.82] 등록 안 된 위치 → 오류 안내 후 다시 입력
                showAlert(`'${raw}'는 등록된 위치가 아닙니다.\n위치매핑에 있는 값으로 다시 입력하세요.`);
                el.focus(); el.select();
                return;
            }
            fixedLocation = v; renderLocBanner(); el.value = '';
            speak('위치 설정'); toast('위치 설정: ' + v);
            lastInputManual = true; refocusManual(); // 위치가 정해졌으니 상품코드 칸으로
        }
        async function manualAddProduct() {
            const el = $('manual-code'); let key = resolveCode(el.value); // [Ver 8.3] 바코드 → 상품코드 변환
            if (!key) return;
            lastInputManual = true; // 오류창을 닫은 뒤 수동입력 칸으로 돌아오게
            if (!fixedLocation) { showAlert('위치를 먼저 설정하세요\n(위 칸에 위치를 입력하거나 위치 바코드를 스캔)'); return; }
            let name = '', exists = false, dbError = false;
            if (navigator.onLine) {
                // 입력한 값 그대로 → 못 찾고 숫자만이면 'S' 붙여 한 번 더 (스캔 흐름과 동일)
                try {
                    let snap = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', key));
                    if (!snap.exists() && /^\d+$/.test(key)) {
                        const alt = 'S' + key;
                        const s2 = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', alt));

                    }

                } catch (e) { dbError = true; }
            } else if (/^\d{6}$/.test(key)) {
                key = 'S' + key;   // 오프라인: 확인할 수 없으므로 'S+6자리' 모양일 때만 붙인다
            }
            // 깨진 값(기호·5자 미만) 검사는 등록된 상품이 아닐 때만 — S+6자리 형식 검사(강제추가 가능)는 아래에서 따로
            if (!exists && !dbError && !/^[A-Z0-9]{5,}$/.test(key)) {
                showAlert('형식 오류\n상품코드를 확인해 주세요\n(예: S550076 · 546881055 · P000DCUU000B)'); return;
            }
            const addLoc = () => { // [Ver 8.56] 위치 큐 추가 (강제추가에서도 재사용)
                locationQueue.unshift({ barcode: key, location: fixedLocation, name, sub: locSubMode, time: new Date().toTimeString().slice(0, 8) });
                saveQueues(); renderQueue(); el.value = ''; el.focus();
                speak('추가'); toast('추가: ' + key);
            };
            // 2026-10-19 사용자 결정: S+6자리 외는 오류 + 강제추가 (숫자 6자리는 위에서 'S' 를 붙인 뒤라 통과)
            if (!checkProductCode(key).ok) { showAlert('상품코드 형식이 아닙니다 (S+숫자6자리): ' + key, () => addLoc(), '강제추가'); return; }
            if (locSubMode === 'today') {
                if (!navigator.onLine) { toast('오프라인 · 목록 확인 생략'); }
                else if (dbError) { showAlert('DB 조회 오류\n(네트워크 확인)\n(' + key + ')', () => addLoc(), '강제추가'); return; } // [Ver 8.56]
                else if (!exists) { showAlert('당일 입고 목록에 없는 상품입니다.\n' + key, () => addLoc(), '강제추가'); return; } // [Ver 8.56] 강제추가 가능
            }
            addLoc();
