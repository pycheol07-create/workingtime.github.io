        // ---------------- 전송 ----------------
        async function sendInbound() {
            if (!inboundQueue.length || sending) return;
            if (!navigator.onLine) { showAlert('오프라인 상태입니다.\n인터넷 연결 후 [전송하기]를 눌러주세요.\n(스캔 내역은 저장되어 있습니다)'); return; }
            sending = true; updateSendBtn('전송 중...'); closeUndo();
            // [Ver 10.7] 진행 중인 미발 확인(트랜잭션)을 최대 3초 기다린다. 그래도 확인 중인 건은 이번 전송에서 빼고 목록에 남긴다
            //   (몫이 서버에 늦게 써진 뒤라면 아무도 못 푸는 hold 가 남는다). 새로고침 뒤 남은 확인 중 건은 hold 문서를 읽어 맞춘다.
            //   15초 넘게 확인 중인 건은 '확인 불가'로 내려 이번에 옛 방식으로 보낸다(늦게 써진 몫은 holdDone 이 풀고, batch 도 h.{id} 를 지운다).
            if (holdPending.size) await Promise.race([Promise.allSettled([...holdPending.values()]), sleep(3000)]);
            await resolvePendingHolds();
            expirePending(true);
            // 보낼 목록은 시작 순간 고정(전송 중 스캔한 건은 목록에 남는다), 반영된 묶음만 sent 에 모은다
            // 목록은 최신이 앞(unshift) → 뒤집어 오래된 스캔부터 보낸다(부분 실패 후 재전송해도 배분이 시간순)
            const all = [...inboundQueue].reverse();
            const items = all.filter(it => !(it && it.hold === 'pending'));
            const held = all.length - items.length;
            if (!items.length) { sending = false; updateSendBtn(); toast(`미발 확인 중인 ${held}건 — 잠시 뒤 다시 [전송하기]`); return; }
            // [Ver 10.7] 비축(2층) 배분은 같은 batch 안에서 increment 로 쓴다(예전: 따로 읽고 통째로 덮어써 두 기기가 겹치면 한쪽이 사라짐).
            //   옛 식(쪼갬 아닌 항목 — 오프라인·옛 형식)은 현재 mibal·received 가 필요해 읽기만 한다. 못 읽으면 쪼갬 항목만 있을 때만 진행.
            let cur = null;
            try { const s2 = await getDoc(doc(db, 'ChinaStockGoods', 'FLOOR2_STOCK')); cur = (s2.exists() && s2.data().map) ? s2.data().map : {}; } catch (e) { cur = null; }
            if (cur === null && items.some(it => !isSplitItem(it))) {
                sending = false; updateSendBtn();
                showAlert('비축(2층) 현황을 불러오지 못해 전송하지 않았습니다.\n네트워크 확인 후 다시 [전송하기]를 눌러 주세요.\n(스캔 내역은 그대로 있습니다)');
                return;
            }
            const sent = [];
            const st = {}; // code -> {received, mibal, floor2, name, writeMibal, writeName} — 이번 전송 안에서 시간순으로 이어서 계산
            let batchFail = false;
            try {
                const CHUNK = 150; // 건당 3작업(ScanDB·입고이력·hold) + 비축 1 = 451 (한도 500 이내)
                for (let i = 0; i < items.length; i += CHUNK) {
                    const batch = writeBatch(db);
                    const part = items.slice(i, i + CHUNK);
                    const f2 = {}; // code -> {received, floor2} 이번 묶음 증가분
                    part.forEach(it => {
                        batch.set(doc(db, 'ChinaStockGoods_ScanDB', it.barcode), { arrivalQty: increment(-it.qty), mibalQty: increment(-it.qty) }, { merge: true }); // [Ver 8.48] 미발수량도 입고분만큼 즉시 차감 (표시는 0에서 클램프) / [Ver 8.51] set-merge: 강제전송된 미등록 상품(ScanDB 문서 없음)도 생성되도록
                        batch.set(doc(collection(db, 'ChinaStockGoods_InboundHistory')), {
                            barcode: it.barcode, qty: it.qty, name: it.name, location: it.location,
                            dest: it.dest, timestamp: serverTimestamp(), worker: 'Scanner_Web'
                        });
                        // [Ver 10.7] 잡아 둔 몫은 같은 batch 에서 푼다(ScanDB 는 qty 전체를 빼므로 이중 차감 없음). 옛 형식(id 없음)은 hold 없음
                        if (it.id) batch.set(holdRef(it.barcode), { h: { [it.id]: deleteField() } }, { merge: true });
                        const c = it.barcode;
                        if (!st[c]) {
                            const ex = (cur && cur[c]) || {};
                            const hasMibal = ex.mibal !== undefined && ex.mibal !== null;
                            st[c] = { received: parseInt(ex.received) || 0, mibal: hasMibal ? (parseInt(ex.mibal) || 0) : (parseInt(it.mibalQty) || 0), floor2: parseInt(ex.floor2) || 0,
                                name: it.name || ex.name || '', writeMibal: cur !== null && !hasMibal, writeName: true };
                        }
                        const s = st[c];
                        // [Ver 8.45→10.7] 쪼갬 항목: 3층 = 잡은 몫, 비축 = 나머지 / 옛 항목: 미발 남으면 그 스캔 전부 3층, 다 찼으면 전부 비축
                        const r = floor2Step(s, it, isSplitItem(it));
                        s.received = r.state.received; s.floor2 = r.state.floor2;
                        const g = f2[c] || (f2[c] = { received: 0, floor2: 0 });
                        g.received += it.qty; g.floor2 += r.floor2Add;
                    });
                    const map = {};
                    Object.keys(f2).forEach(c => {
                        const s = st[c];
                        const e = { received: increment(f2[c].received), floor2: increment(f2[c].floor2) };
                        if (s.writeMibal) e.mibal = s.mibal;                        // 기준 미발이 없을 때만 한 번(예전과 같은 값)
                        if (s.writeName && (s.name || cur !== null)) e.name = s.name; // 웹은 floor2·name 만 읽는다
                        map[c] = e;
                    });
                    batch.set(doc(db, 'ChinaStockGoods', 'FLOOR2_STOCK'), { map, updatedAt: serverTimestamp() }, { merge: true });
                    await batch.commit();
                    Object.keys(f2).forEach(c => { st[c].writeMibal = false; st[c].writeName = false; });
                    sent.push(...part);
                }
            } catch (e) { batchFail = true; }
            // 반영된 건만 목록에서 뺀다(실패한 묶음·확인 중인 건·전송 중 스캔한 건은 남김)
            const sentSet = new Set(sent);
            inboundQueue = inboundQueue.filter(it => !sentSet.has(it));
            saveQueues(); renderQueue();
            if (batchFail) {
                showAlert(`전송 실패 — ${sent.length}건은 반영됨, 남은 ${items.length - sent.length}건만 목록에 남겼습니다.\n(권한 또는 네트워크 오류)`);
            } else {
                speak('전송 완료'); toast(held ? `입고 처리 완료 — 미발 확인 중 ${held}건은 목록에 남김` : '입고 처리 완료');
            }
            sending = false; updateSendBtn();
        }

        // [Ver 6.5] 위치 병합: 기존값(콤마 다중) + 새 위치들 → 중복 제거, 새 자리는 끝에 추가
        // [Ver 8.39] 스캐너는 그냥 기존값 뒤에 새 위치 append (맨앞/맨뒤는 웹 다운로드 시 재배치)
        function mergeLocations(existing, additions) {
            const list = [], seen = new Set();
            const push = v => { v = (v || '').toString().trim(); if (v && !seen.has(v)) { seen.add(v); list.push(v); } };
            (existing || '').toString().split(',').forEach(push);
            (additions || []).forEach(push);
            return list.join(',');
        }
        async function sendLocation() {
            if (!locationQueue.length || sending) return;
            if (!navigator.onLine) { showAlert('오프라인 상태입니다.\n인터넷 연결 후 [전송하기]를 눌러주세요.\n(스캔 내역은 저장되어 있습니다)'); return; }
            sending = true; updateSendBtn('전송 중...'); closeUndo();
            const items = [...locationQueue];
            // [Ver 6.5] 상품별 최신 위치를 '누적(append)'로 기록 — 한 상품이 여러 자리를 가짐(콤마 구분)
            //   같은 상품을 여러 번 찍으면 스캔 순서대로 이어붙이고, 기존 저장값 뒤에 새 자리를 추가
            let fbOk = false;
            try {
                // 상품별 스캔 위치 모으기 (queue는 최신이 앞 → 시간순으로 뒤집어 순서 보존)
                const byCode = new Map();
                [...items].reverse().forEach(it => {
                    if (!byCode.has(it.barcode)) byCode.set(it.barcode, { sub: it.sub || '', locs: [] });
                    byCode.get(it.barcode).locs.push(it.location);
                });
                const codes = [...byCode.keys()];
                // [Ver 8.15] 위치 데이터는 샤드 문서(LOC_SHARD_i.map). 찍은 상품이 속한 샤드만 읽고 그 샤드에만 씀
                const codesByShard = {};
                codes.forEach(c => { const sid = locShardId(c); (codesByShard[sid] = codesByShard[sid] || []).push(c); });
                const shardMaps = {};
                try {
                    await Promise.all(Object.keys(codesByShard).map(async sid => {
                        const s = await getDoc(doc(db, 'ChinaStockGoods', sid));
                        shardMaps[sid] = (s.exists() && s.data() && s.data().map) ? s.data().map : {};
                    }));
                } catch (e) {
                    // [Ver 8.13] 기존 위치를 못 읽으면 덮어써서 기존 자리 유실 위험 → 전송 중단, 큐 보존
                    throw new Error('READ_FAILED');
                }
                const now = Date.now();
                for (const sid in codesByShard) {
                    const upd = {};
                    codesByShard[sid].forEach(c => {
                        const g = byCode.get(c);
                        const cur = shardMaps[sid][c] || {};
                        const loc = cur.location || '';
                        const base = (cur.base !== undefined ? cur.base : loc);
                        upd[c] = { location: mergeLocations(loc, g.locs), base: base, sub: g.sub, at: now, worker: 'Scanner_Web' };
                    });
                    await setDoc(doc(db, 'ChinaStockGoods', sid), { map: upd, updatedAt: new Date() }, { merge: true });
                }
                fbOk = true;
            } catch (e) { console.error('위치 Firebase 기록 실패:', e); if (e && e.message === 'READ_FAILED') fbOk = 'READ_FAILED'; }
            // [Ver 8.0] Firebase 저장이 실제로 성공했을 때만 큐를 비움 (실패 시 큐 보존 → 재시도)
            if (fbOk === true) {
                locationQueue = []; fixedLocation = null; saveQueues(); renderQueue(); renderLocBanner();
                speak('전송 완료'); toast('위치 전송 완료');
            } else if (fbOk === 'READ_FAILED') {
                showAlert('기존 위치를 불러오지 못해 전송을 중단했습니다.\n(그대로 저장하면 기존 자리가 지워질 수 있어 막았습니다)\n무료 사용량 한도/네트워크를 확인하고 다시 시도하세요.\n스캔 내역은 그대로 보관됩니다.');
            } else {
                showAlert('전송 실패 — 저장되지 않았습니다.\n큐를 유지하니 다시 [전송하기]를 눌러 재시도하세요.\n(네트워크 또는 무료 사용량 한도 확인)');
            }
            sending = false; updateSendBtn();
        }

        // ---------------- 렌더링 ----------------
        function currentQueue() { return mode === 'in' ? inboundQueue : locationQueue; }

        function renderQueue() {
            const q = currentQueue(); const el = $('queue');
            if (!q.length) { el.style.display = 'none'; el.innerHTML = ''; updateSendBtn(); return; }
            el.style.display = 'block';
            el.innerHTML = q.map((it, i) => {
                // [Ver 4.0] 위치 모드: 당일 입고분은 상품명, ScanDB에 없으면 표시 / [Ver 8.56] 당일입고 강제추가분은 '목록없음'으로 구분
                const label = it.name ? it.name : (mode === 'loc' ? (it.sub === 'today' ? '목록없음' : '기존재고') : '');
                // [Ver 10.7] 미발 몫 확인 상태 — 오프라인·확인 불가(옛 방식으로 전송) / 확인 중
                const holdTag = mode !== 'in' ? '' : (it.hold === 'offline' ? `<span class="qhold" style="color:var(--c-risk-text);font-weight:800">${it.holdWhy ? '확인 불가' : '오프라인'}</span> · `
                    : (it.hold === 'pending' ? '<span class="qhold" style="color:var(--c-text-3)">확인 중</span> · ' : ''));
                return `
                <div class="qitem">
                    <div class="qinfo">
                        <div class="qcode">${it.barcode}</div>
                        <div class="qsub">${holdTag}${mode === 'loc' && it.sub === 'existing' ? '<span class="qtag-ex">기존재고</span>' : ''}${label ? (label === '목록없음' && !it.name ? '<span style="color:var(--c-risk-text);font-weight:800">목록없음</span>' : label) + ' · ' : ''}${it.location} · ${it.time}</div>
                    </div>
                    ${mode === 'in' ? `<div class="qqty">${it.qty}개</div>` : ''}
                    <button class="qdel" data-i="${i}" aria-label="삭제"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block; margin:3.5px 0;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                </div>`;
            }).join('');
            el.querySelectorAll('.qdel').forEach(b => b.onclick = () => {
                // 전송 중에는 지우지 않는다 — 이미 보내는 목록에 들어 있어 지워도 전송된다
                if (sending) { toast('전송 중에는 삭제할 수 없습니다'); return; }
                const q = currentQueue(); const i = parseInt(b.dataset.i);
                const removed = q.splice(i, 1)[0];
                // [Ver 10.7] 잡아 둔 미발은 바로 풀지 않는다(되돌릴 수 있게) — 되돌리기가 끝날 때 푼다. 그 전에 꺼져도 시작 때 풀리게 먼저 적어 둔다
                if (removed && mode === 'in' && removed.id) { deletedEntries.set(removed.id, removed); markRelease(removed.barcode, removed.id); }
                saveQueues(); renderQueue();
                if (removed) offerUndo(mode, i, removed);
            });
            updateSendBtn();
        }

        // 목록에서 지운 1건을 5초 동안 되돌릴 수 있다(UX 개선 12번). 저장 방식(localStorage 의 scanInQueue/scanLocQueue)은 그대로 —
        // 지울 때 바로 저장하고, 되돌리면 같은 목록·같은 자리에 다시 넣어 저장한다. 또 지우면 앞의 되돌리기는 끝난다(마지막 1건만).
        let undoTimer = null;
        let undoPending = null;   // [Ver 10.7] 되돌리기를 기다리는 1건 { which, item } — 끝나면 잡아 둔 미발을 푼다
        function finishUndo() {
            const u = undoPending; undoPending = null;
            if (u && u.which === 'in' && u.item && u.item.id) releaseHold(u.item.barcode, u.item.id);
        }
        function offerUndo(which, index, item) {
            const box = $('undo-toast'); if (!box) return;
            clearTimeout(undoTimer);
            finishUndo();   // 앞의 되돌리기는 끝 — 그 건의 몫을 푼다
            undoPending = { which, item };
            $('undo-toast-msg').textContent = `${item.barcode || '1건'} 삭제됨`;
            box.classList.add('show');
            $('undo-toast-btn').onclick = () => {
                // 전송 중에는 되돌리지 않는다 — 보내는 중인 목록에 끼워 넣으면 보낸 것/안 보낸 것이 섞인다
                if (sending) { toast('전송 중에는 되돌릴 수 없습니다'); return; }
                clearTimeout(undoTimer); box.classList.remove('show');
                undoPending = null;
                if (which === 'in' && item.id) { deletedEntries.delete(item.id); unmarkRelease(item.id); } // 되돌리면 할 일 없음(몫은 그대로)
                // 전송하면 목록 배열이 새로 만들어지므로(inboundQueue = []) 되돌릴 때 그때의 배열을 다시 찾는다
                const queue = which === 'in' ? inboundQueue : locationQueue;
                queue.splice(Math.min(index, queue.length), 0, item); saveQueues(); renderQueue();
                toast('되돌렸습니다');
            };
            undoTimer = setTimeout(() => { box.classList.remove('show'); $('undo-toast-btn').onclick = null; finishUndo(); }, 5000);
        }

        // 전송을 시작하면 되돌리기 토스트를 닫는다(앞에서 지운 1건은 그대로 삭제 확정)
        function closeUndo() { clearTimeout(undoTimer); const box = $('undo-toast'); if (box) box.classList.remove('show'); const ub = $('undo-toast-btn'); if (ub) ub.onclick = null; finishUndo(); }

        function updateSendBtn(text) {
            const btn = $('btn-send');
            btn.textContent = text || `전송하기 (${currentQueue().length})`;
            btn.disabled = sending || currentQueue().length === 0;
        }

        function renderLocBanner() {
            const b = $('loc-banner');
            b.style.display = mode === 'loc' ? 'block' : 'none';
            const subTxt = locSubMode === 'today' ? '당일 입고분' : '⚠ 기존재고 모드';
            b.classList.toggle('existing', locSubMode === 'existing');
            if (fixedLocation) { b.textContent = `작업 위치: ${fixedLocation}  (${subTxt})`; b.classList.add('fixed'); }
            else { b.textContent = `위치를 먼저 스캔하세요  (${subTxt})`; b.classList.remove('fixed'); }
        }

        function setLocSubMode(s) { // [Ver 4.1]
            locSubMode = s; localStorage.setItem('scanLocSub', s);
            document.querySelectorAll('#loc-submode button').forEach(btn => btn.classList.toggle('active', btn.dataset.sub === s));
            renderLocBanner();
        }

        function setMode(m) {
            mode = m; localStorage.setItem('scanMode', m);
            $('tab-in').classList.toggle('active', m === 'in');
            $('tab-loc').classList.toggle('active', m === 'loc');
            $('tab-in').setAttribute('aria-pressed', m === 'in' ? 'true' : 'false');
            $('tab-loc').setAttribute('aria-pressed', m === 'loc' ? 'true' : 'false');
            $('loc-submode').style.display = m === 'loc' ? 'flex' : 'none'; // [Ver 4.1]
            $('loc-manual-row').style.display = m === 'loc' ? 'block' : 'none'; // [Ver 8.1] 수동입력 토글 버튼
            $('loc-manual').style.display = 'none'; // 토글로만 열림 (모드 전환 시 닫음)
            const mt = $('btn-manual-toggle'); if (mt) { mt.textContent = '수동입력'; mt.style.background = 'var(--c-surface)'; }
            $('in-manual-row').style.display = m === 'in' ? 'block' : 'none'; // [Ver 8.71] 입고모드 수동입력 토글
            $('in-manual').style.display = 'none';
            const it = $('btn-in-manual-toggle'); if (it) { it.textContent = '수동입력'; it.style.background = 'var(--c-surface)'; }
            const theme = m === 'in' ? '#2F62C9' : '#3D756F';
            document.querySelector('.tabs').style.background = theme;
            $('btn-send').style.background = '';
            document.body.style.setProperty('--theme', theme);
            renderLocBanner(); renderQueue();
        }

        let alertForceAction = null; // [Ver 8.50] 강제 진행 콜백 (있으면 강제 버튼 노출)
        function showAlert(msg, forceAction, forceLabel) {
            speak('오류');
            try { navigator.vibrate([200, 100, 200]); } catch (e) {} // [Ver 8.50] 오류 시 진동
            $('alert-msg').textContent = msg;
            alertForceAction = forceAction || null;
            const fb = $('alert-force');
            fb.textContent = forceLabel || '강제전송'; // [Ver 8.56] 상황별 버튼 라벨(입고=강제전송 / 위치=강제추가)
            fb.style.display = alertForceAction ? 'block' : 'none';
            $('ov-alert').style.display = 'flex';
            pushScanModal(); // [Ver 9.7] 뒤로가기로 팝업만 닫히게
        }

        // ---------------- 버전 체크 ----------------
        async function checkVersion() {
            try {
                const res = await fetch(new URL('china-stock-version.json', location.href).href + '?_=' + Date.now(), { cache: 'no-store' }); // [Ver 9.8] china-stock 전용 버전파일. [Ver 8.47] ?_=시각으로 CDN 캐시 우회 (no-store만으로는 max-age=600 CDN 캐시 못 뚫음)
                const info = await res.json();
                if (info.web && info.web !== SCAN_VERSION) {
                    const b = $('update-banner');
                    if (b.style.display !== 'block') {
                        b.innerHTML = `새 버전(Ver ${info.web}) 배포됨 `;
                        const btn = document.createElement('button');
                        btn.textContent = '지금 새로고침'; btn.onclick = () => location.reload();
                        b.appendChild(btn); b.style.display = 'block';
                    }
                }
            } catch (e) {}
        }

        // ---------------- 이벤트 바인딩 ----------------
        $('btn-start').onclick = startScan;
        // [Ver 3.5] 손전등/줌
        $('btn-torch').onclick = () => { torchOn = !torchOn; $('btn-torch').style.opacity = torchOn ? '1' : '0.5'; applyCam(); };
        $('btn-zoom-in').onclick = () => {
            if (!zoomCaps) return;
            zoomLevel = Math.min((zoomCaps.max || 4), +(zoomLevel + (zoomCaps.step || 0.5)).toFixed(1));
            $('zoom-label').textContent = zoomLevel.toFixed(1) + 'x'; applyCam();
        };
        $('btn-zoom-out').onclick = () => {
            if (!zoomCaps) return;
            zoomLevel = Math.max((zoomCaps.min || 1), +(zoomLevel - (zoomCaps.step || 0.5)).toFixed(1));
            $('zoom-label').textContent = zoomLevel.toFixed(1) + 'x'; applyCam();
        };
        // [Ver 3.9] 수동 촬영 버튼 + 화면 탭 → 초점
        $('btn-capture').onclick = (e) => { e.stopPropagation(); manualCapture(); };
        // [Ver 8.1] 수동입력 토글
        $('btn-manual-toggle').onclick = () => {
            const open = $('loc-manual').style.display !== 'flex';
            $('loc-manual').style.display = open ? 'flex' : 'none';
            $('btn-manual-toggle').textContent = open ? '수동입력 닫기' : '수동입력';
            $('btn-manual-toggle').style.background = open ? 'var(--c-track)' : 'var(--c-surface)';
            if (open) $('manual-loc').focus();
        };
        // [Ver 8.0] 위치모드 수동 입력 바인딩 (버튼 + Enter)
        $('btn-manual-loc').onclick = manualSetLocation;
        $('manual-loc').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); manualSetLocation(); } });
        $('btn-manual-code').onclick = manualAddProduct;
        $('manual-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); manualAddProduct(); } });
        // [Ver 8.71] 입고모드 수동입력
        $('btn-in-manual-toggle').onclick = () => {
            const open = $('in-manual').style.display !== 'block';
            $('in-manual').style.display = open ? 'block' : 'none';
            $('btn-in-manual-toggle').textContent = open ? '수동입력 닫기' : '수동입력';
            $('btn-in-manual-toggle').style.background = open ? 'var(--c-track)' : 'var(--c-surface)';
            if (open) $('in-manual-code').focus();
        };
        $('btn-in-manual-code').onclick = inManualSubmit;
        $('in-manual-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); inManualSubmit(); } });
        // [Ver 8.1] 오프라인 감지 표시
        function updateNet() { const b = $('offline-bar'); if (b) b.style.display = navigator.onLine ? 'none' : 'block'; }
        window.addEventListener('online', updateNet);
        window.addEventListener('online', () => { resolvePendingHolds(); retryReleases(); }); // [Ver 10.7] 미뤄 둔 미발 확인·해제
        window.addEventListener('offline', updateNet);
        updateNet();
        $('reader').addEventListener('click', (e) => {
            if (!scanning) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const nx = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            const ny = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
            showFocusRing(e.clientX, e.clientY);
            focusAt(nx, ny);
        });
        $('tab-in').onclick = () => setMode('in');
        $('tab-loc').onclick = () => setMode('loc');
        // [Ver 4.1] 위치 세부 작업 선택
        document.querySelectorAll('#loc-submode button').forEach(btn => btn.onclick = () => setLocSubMode(btn.dataset.sub));
        $('btn-send').onclick = () => mode === 'in' ? sendInbound() : sendLocation();

        $('sel-cancel').onclick = () => { closeSelect(); resumeScan(); };
        $('alert-ok').onclick = () => { $('ov-alert').style.display = 'none'; alertForceAction = null; popScanModal(); resumeScan(); refocusManual(); };
        $('alert-force').onclick = () => { const act = alertForceAction; alertForceAction = null; $('ov-alert').style.display = 'none'; if (act) act(); }; // [Ver 8.50] 강제전송 → 정상 입고 단계로

        $('btn-settings').onclick = () => {
            $('set-direct').checked = directQty;
            $('ov-set').style.display = 'flex';
        };
        $('set-close').onclick = () => {
            directQty = $('set-direct').checked;
            localStorage.setItem('scanDirectQty', directQty ? '1' : '0');
            $('ov-set').style.display = 'none'; toast('설정 저장됨');
        };

        // ---------------- 초기화 ----------------
        loadLocationMap(); // [Ver 5.8] 위치 매핑 로드
        loadBarcodeMap(); // [Ver 8.3] 바코드→상품코드 맵 로드
        loadBarcodeMemo(); // [Ver 8.88] 오류 사유(작은 문서) 로드
        subscribeForceAllow(); // [Ver 8.50] 강제전송 허용목록 실시간 구독
        buildQtySelector();
        $('status-line').textContent = `v${SCAN_VERSION} · 서버: ${serverLabel}`;
        setLocSubMode(locSubMode); // [Ver 4.1] 세부 작업 표시 — (2026-10-16) 열 때마다 '당일 입고분'으로 시작
        setMode(mode);
        checkVersion();
        // [Ver 10.7] 시작 정리 — 결과를 모른 채 남은 미발 확인(pending)을 맞추고, 못 푼 몫을 다시 푼다. 로그인 전이면 실패 → online·다음 시작 때
        resolvePendingHolds().finally(() => retryReleases());
        window.addEventListener('focus', checkVersion);
        setInterval(checkVersion, 10 * 60 * 1000);
    </script>
    <script type="module" src="js/page-gate.js?v=202610281554" data-perm-page="scan.view" data-perm-app="scanApp"></script>
    <script type="module" src="js/app-shell.js?v=202610281554"></script>
</body>
